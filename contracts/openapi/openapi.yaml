  # ===================================================================
  # Session-limit policies (FR-SESS-3 write surface).
  # Per-identity overrides for the three session-limit knobs; every stored
  # value is ENFORCED (no dead config): cap + duration at Authorize, idle
  # via the signed decision context at the Gateway.
  # ===================================================================
  /v1/session-limit-policies:
    get:
      operationId: listSessionLimitPolicies
      summary: List session-limit policies (admin).
      description: |
        Lists per-identity session-limit policies (`config.session_limit_policy`;
        FR-SESS-3) — overrides for the concurrent-session cap, max session
        duration, and idle timeout. When several policies match an identity the
        most restrictive value wins per knob; the `operator_settings` cluster
        defaults apply where no policy matches. Cursor-paginated. Platform-RBAC
        gated (`rbac:read`).
      tags:
