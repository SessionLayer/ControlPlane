      title: Rotate CA Request
      description: |
        Optional overrides for the incoming key; omitted fields inherit the active CA.

        Overriding `backend` is how a CA is **moved onto a different key service**.
        A CA's private key cannot be migrated — a key in Azure Key Vault is *in*
        Key Vault — so adoption is necessarily a rotation onto a new key, and the
        overlap window is what gives the fleet time to trust it.
      properties:
        algorithm:
          $ref: '#/components/schemas/CaAlgorithm'
        backend:
          allOf:
            - $ref: '#/components/schemas/CaBackend'
          description: |
            The backend the incoming key lives in; defaults to the active CA's.
            Naming a backend this build has no signer for is a `422` — the check
            happens before anything is written, so a rotation cannot leave the CA
            kind pointing at a key nothing can sign with.

            When this is `azure_keyvault`, `keyReference` is required and must be a
            fully **versioned** Key Vault key identifier. When it is `aws_kms`,
            `keyReference` is required and must be a KMS **key ARN**.
        keyReference:
          type: string
          minLength: 1
          description: |
            The incoming key handle/reference (backend-provisioned); private
            material is rejected (`422`).

            For `azure_keyvault` this is the versioned key identifier
            `https://<vault>.vault.azure.net/keys/<name>/<version>`. The version is
            **required**: the CA's public half is published to every node's
            trusted-CA set, so a vault-side rotation that floated the signing key
            underneath a running CA would have the Control Plane emitting
            certificates no node trusts, with no error on the Control Plane side.

            For `aws_kms` this is the key ARN
            `arn:aws:kms:<region>:<account>:key/<key-id>`. An **alias** ARN is
            refused for the same reason: `kms:UpdateAlias` repoints an alias without
            changing anything the Control Plane can see, which swaps the signing key
            underneath a CA whose old public half is already distributed.
      additionalProperties: false
    CaPage:
      type: object
      title: CA Page
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaResource'
        nextCursor:
          type: string
      additionalProperties: false
    CaPublicKey:
      type: object
      title: CA Public Key
      description: >-
        The active CA's PUBLIC key for one SSH kind — the material a node or a
        client pins to verify certificates this CA issues. No private key, key
        reference, or wrapped material appears here or can be derived from it.
      required:
        - caKind
        - algorithm
        - rotationState
        - publicKeySpkiDer
        - opensshPublicKey
        - fingerprint
      properties:
        caKind:
          $ref: '#/components/schemas/CaKind'
        algorithm:
          $ref: '#/components/schemas/CaAlgorithm'
        rotationState:
          $ref: '#/components/schemas/CaRotationState'
        publicKeySpkiDer:
          type: string
          description: The public key as base64-encoded DER SubjectPublicKeyInfo.
        opensshPublicKey:
          type: string
          description: >-
            The same key as a single OpenSSH authorized-key line
            (`ecdsa-sha2-nistp256 AAAA...`), ready to write into
            `TrustedUserCAKeys` or a `@cert-authority` entry.
        fingerprint:
          type: string
          description: >-
            The OpenSSH `SHA256:...` fingerprint of `opensshPublicKey`, as
            `ssh-keygen -l` prints it, so an operator can verify what they
            installed matches what the Control Plane serves.
      additionalProperties: false
