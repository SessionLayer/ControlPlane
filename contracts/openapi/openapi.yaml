    # ============ shared enums & value types ============
    Origin:
      type: string
      title: Config Provenance
      description: |
        Provenance of a config row (Design §13). `api`/`ui` mark which admin surface
        last wrote it; `default` is a seeded/cold-start default. Read-only.
      enum:
        - api
        - ui
        - default
    Capability:
      type: string
      title: SSH Capability
      description: A policy-gated SSH channel capability (Design D14).
      enum:
        - shell
        - exec
        - sftp
        - scp
        - port_forward_local
        - port_forward_remote
        - agent_forward
        - x11
    PlatformPermission:
      type: string
      title: Platform Permission
      description: A granular platform-RBAC permission from the closed vocabulary (FR-PADM-1).
      enum:
        - rbac:read
        - rbac:write
        - node:enroll
        - node:quarantine
        - node:remove
        - gateway:enroll
        - gateway:remove
        - ca:manage
        - ca:rotate
        - request:approve
        - recording:replay
        - recording:export
        - recording:delete
        - recording:key-manage
        - audit:read
        - user:manage
        - settings:write
        - lock:read
        - lock:write
        - breakglass:manage
    Effect:
      type: string
      title: Rule Effect
      enum:
        - allow
        - deny
    ConnectorKind:
      type: string
      title: Connector Kind
      enum:
        - agent
        - agentless
    SubjectKind:
      type: string
      title: Binding Subject Kind
      enum:
        - user
        - group
    CaKind:
      type: string
      title: CA Kind
      enum:
        - user
        - session
        - host
    CaBackend:
      type: string
      title: CA Backend
      description: |
        Where a CA's private key lives. Three of these can actually sign:

        - `local` — the key is in the Control Plane's database, encrypted under an
          operator KEK. Always available.
        - `azure_keyvault` — the key is in Azure Key Vault and never leaves it. The
          Control Plane signs by calling the vault, and the deployment must have
          `sessionlayer.ca.azure.*` configured; a CA naming this backend on a
          Control Plane that does not fails closed rather than signing locally.
        - `aws_kms` — the key is in AWS KMS and never leaves it. The Control Plane
          signs by calling `Sign` on a pinned key ARN, and the deployment must have
          `sessionlayer.ca.aws.*` configured; the same fail-closed rule applies.

        `vault` is an **integration seam with no implementation**: the interface
        exists for a deployment to bind, but this build cannot produce a signer for
        it, so a CA naming it would accept the write and then fail every signature.
        Creating or updating a CA onto it is rejected (`422`).

        The set is deliberately never narrowed — a row an upgraded deployment
        already holds must stay readable.
      enum:
        - local
        - aws_kms
        - azure_keyvault
        - vault
    CaAlgorithm:
      type: string
      title: CA Algorithm
      description: |
        The algorithms a CA row may carry. This set is deliberately EXACTLY the
        set the `ca_config.algorithm` CHECK admits, so no stored row can hold a
        value this enum cannot map — the read paths deserialize the stored
        algorithm through this enum, and a value outside it would fail the read
        rather than the write.

        The set is therefore wider than what can be created. Only the three
        ECDSA curves can actually be assembled into a signer; a create naming
        one of the others is rejected with a `422` that says so. They remain
        members because a deployment may already hold such a row from before
        that check existed, and `GET /v1/cas` has to be able to show it.
      enum:
        - ecdsa-p256
        - ecdsa-p384
        - ecdsa-p521
        - ed25519
        - rsa-2048
        - rsa-4096
    CaRotationState:
      type: string
      title: CA Rotation State
      description: Rotation-state-machine position (managed server-side; read-only over the API).
      enum:
        - incoming
        - active
        - outgoing
        - expired
    ServiceAccountAuthMethod:
      type: string
      title: Service-Account Auth Method
      enum:
        - private_key_jwt
        - mtls
        - client_secret
    BreakglassAuthPath:
      type: string
      title: Break-glass Auth Path
      enum:
        - fido2
        - offline_code
    AccessModel:
      type: string
      title: Access Model
      enum:
        - standing
        - jit
        - breakglass
    WormMode:
      type: string
      title: WORM Mode
      description: >-
        Object-lock mode for new recordings (FR-AUD-3/6). `governance` is
        deletable by a privileged audited role (the GDPR escape hatch);
        `compliance` is truly un-deletable. The cluster default only ratchets
        towards `compliance`.
      enum:
        - compliance
        - governance
    RecordingKeySealAlgorithm:
      type: string
      title: Recording Key Seal Algorithm
      description: >-
        How the Gateway seals a per-recording data key to the customer's public
        key. `ecies_p256` (the portable default) requires an EC key on P-256;
        `rsa_oaep_sha256` requires an RSA key. A submitted key that does not
        match is rejected (`422`).
      enum:
        - ecies_p256
        - rsa_oaep_sha256
    DeploymentManagedField:
      type: string
      title: Deployment-Managed Setting
      description: >-
        An operator-settings field currently pinned by a deployment property and
        reconciled into the row on every boot. Changing a pinned field over the
        API is refused (`422`) rather than accepted and silently reverted at the
        next restart.
      enum:
        - defaultMaxSessionSeconds
        - defaultIdleTimeoutSeconds
        - defaultMaxConcurrentSessions
