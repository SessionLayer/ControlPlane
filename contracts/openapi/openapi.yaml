  # ===================================================================
  # Cluster operator settings (`config.operator_settings`). A DB-enforced
  # singleton, so this is GET/PUT on one resource with no collection and
  # no id in the path. The customer recording key is a sub-resource with
  # its own permission because it is the only setting whose holder can
  # make future recordings readable to themselves.
  # ===================================================================
  /v1/operator-settings:
    get:
      operationId: getOperatorSettings
      summary: Get the cluster operator settings (admin).
      description: |
        Returns the cluster-wide operator settings (`config.operator_settings`) —
        audit/recording retention, the WORM default for new recordings, the OTP
        TTL, the session-limit cluster defaults (FR-SESS-3), and whether the
        customer recording key is provisioned. The row is a singleton written by
        cold start, so it is addressed by this path and has no id.

        The projection is explicit and narrower than the row. The
        key-encryption-key reference is NEVER returned, for two independent
        reasons. It is dead: no code path reads or writes that column, and the
        key-encryption reference that is actually live is a deployment property
        persisted per key alongside the key material it wraps — so exposing this
        one would ship a knob an operator could set and reasonably believe had
        repointed the KEK. And were it ever wired up, its whole content would be
        *where the platform's most sensitive key lives*, which is a targeting
        hint for the very asset it protects rather than a setting anyone reads
        back. The `bootstrap*` fields are owned by the first-admin bootstrap flow
        and are not settings.
        Recording-key BYTES are not here either; this resource reports only
        `recordingKeyConfigured` and the sub-resource serves the key itself.

        Platform-RBAC gated (`rbac:read`).
      tags:
        - operator-settings
      responses:
        '200':
          description: The cluster operator settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSettings'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateOperatorSettings
      summary: Update the cluster operator settings (admin).
      description: |
        Replaces the writable operator settings. The `version` is required and
        must match (optimistic concurrency — a stale version is a `409`). The
        `origin` is server-set to `api`. Platform-RBAC gated (`settings:write`),
        audited before/after.

        **The evidence-retention knobs move one way only.** `auditRetentionDays`
        and `recordingRetentionDays` accept an increase or an unchanged value,
        and `defaultWormMode` accepts `governance` -> `compliance`; the opposite
        direction is a `422` — at this scope and at every other. Shortening audit
        retention makes the next prune drop partitions it would otherwise have
        kept, shortening recording retention shortens the object-lock
        retain-until stamped on new recordings, and `compliance` ->
        `governance` makes new recordings deletable instead of un-deletable.
        Those are one-call anti-forensics primitives, and they do not become
        reachable merely because this resource now has an API. Weakening one
        stays a deliberate, out-of-band act by the database owner.

        **Deployment-pinned fields are refused, never silently reverted.** Each
        of `defaultMaxSessionSeconds`, `defaultIdleTimeoutSeconds` and
        `defaultMaxConcurrentSessions` is reconciled from a deployment property
        on every boot when that property is set; `deploymentManagedFields` in the
        `GET` reports which of them are pinned right now. Changing a pinned field
        here is a `422` naming the property that owns it, because accepting the
        write would ship a setting that reverts at the next restart. Submitting a
        pinned field with its value unchanged is not a change and is accepted, so
        a read-modify-write of the whole resource still works.

        `defaultCaBackend` is read-only and is not part of the request schema (a
        `400`): it is consumed only when cold start provisions a CA kind that has
        no row yet, so once the CAs exist, changing it changes nothing. The
        backend that governs a live CA is `/v1/cas`.
      tags:
        - operator-settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperatorSettingsRequest'
      responses:
        '200':
          description: The updated operator settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSettings'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/operator-settings/recording-customer-key:
    get:
      operationId: getRecordingCustomerKey
      summary: Get the customer recording key (admin).
      description: |
        Returns the provisioned customer recording key — PUBLIC material only
        (FR-AUD-2, Design §15). The Gateway seals every per-recording data key to
        this public key and the private half never reaches the platform, so the
        platform cannot decrypt its own recordings.

        An unprovisioned key is a `200` with `configured: false`, not a `404`:
        "not provisioned yet" is the normal state of a fresh install, not a
        missing resource. Platform-RBAC gated (`rbac:read`).
      tags:
        - operator-settings
      responses:
        '200':
          description: The customer recording key (public material only), or an unprovisioned result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCustomerKey'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: setRecordingCustomerKey
      summary: Provision or rotate the customer recording key (admin, privileged).
      description: |
        Provisions the customer recording key, or rotates it. With strict
        recording on — the shipped default — a Control Plane with no key refuses
        every session, so this is the operation that lets a first install be
        completed holding an API credential rather than a database one.

        Platform-RBAC gated on **`recording:key-manage`**, a permission of its
        own. Its holder can point future recordings at a public key whose private
        half they control, which is a privilege of a different kind from anything
        else this resource confers: `settings:write` is already full config
        administration, but it has never been able to break the property that the
        platform cannot read its own recordings, and folding the key into it
        would hand that to every config administrator. The permission is implied
        by no other and implies none.

        Only PUBLIC material is ever stored, and the endpoint proves that before
        it writes anything: the submission must base64-decode to a non-empty DER
        SubjectPublicKeyInfo of at most 8 KiB, must not be private key material
        in any encoding (PKCS#8 `PrivateKeyInfo`, SEC1 `ECPrivateKey`, or PEM
        text of any kind), and must match `sealAlgorithm` — EC on P-256 for
        `ecies_p256`, RSA for `rsa_oaep_sha256`. Each failure is a `422` that
        says which, so a curve mismatch surfaces here rather than as a
        fail-closed session at the worst possible moment. `keyRef` is a reference
        only and is refused the same way if it carries key material.

        **Rotation is allowed and it is not quiet.** Every recording sealed under
        the outgoing key remains readable only by the outgoing private key; the
        incoming key cannot read them. So a rotation — any write when a key is
        already configured — additionally requires `expectedFingerprintSha256`
        echoing the key being replaced (a blind or racing overwrite is a `409`)
        and `acknowledgeExistingRecordingsUndecryptable: true` (a `422`
        otherwise). First provisioning, where no key and no recording exists,
        requires neither.

        There is no `DELETE`: un-provisioning the key would fail-close every
        future session, and that is not an operator task.

        Audited before/after, carrying FINGERPRINTS only — never key bytes.
      tags:
        - operator-settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRecordingCustomerKeyRequest'
      responses:
        '200':
          description: The provisioned or rotated key (public material only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingCustomerKey'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  # ===================================================================
  # Runtime session management (list + terminate).
  # `sessions` is RUNTIME (never config); terminate reuses the Lock
  # teardown path (Design §8.3/§8.4).
  # ===================================================================
  /v1/sessions:
    get:
      operationId: listSessions
      summary: List SSH sessions (admin).
      description: |
        Lists SSH sessions (`runtime.ssh_session`; Design §12A) with their decision
        snapshot (identity, node, principal, access model, capabilities, grant
        expiry). Optional filters narrow by identity, node, access model, and
        active-only. Cursor-paginated. Platform-RBAC gated (`audit:read`).
      tags:
        - sessions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: identity
          in: query
          required: false
          description: Filter to one subject identity.
          schema:
            type: string
        - name: nodeId
          in: query
          required: false
          description: Filter to one node id.
          schema:
            type: string
            format: uuid
        - name: accessModel
          in: query
          required: false
          description: Filter to one access model.
          schema:
            type: string
            enum: [standing, jit, breakglass]
        - name: activeOnly
          in: query
          required: false
          description: When true, return only sessions that have not ended.
          schema:
            type: boolean
      responses:
        '200':
          description: A page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      summary: Get an SSH session (admin).
      description: Returns one session by id. Platform-RBAC gated (`audit:read`).
      tags:
        - sessions
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}/terminate:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: terminateSession
      summary: Terminate an SSH session (admin).
      description: |
        Tears down a live session by pushing a top-tier `Lock` (Design §8.3/§8.4)
        scoped to the session's subject identity, reusing the teardown path — a
        deny that wins and is actively pushed to every Gateway (fail-closed). Because
        the wire `Lock` selector has no per-session facet, the teardown is
        identity-scoped (it also affects that identity's other live sessions); it is
        bounded by a short TTL so the identity may immediately reconnect under an
        unchanged policy. Idempotent. Platform-RBAC gated (`lock:write`) + audited.
      tags:
        - sessions
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateSessionRequest'
      responses:
        '202':
          description: The teardown lock was pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/session-leases:
    get:
      operationId: listSessionLeases
      summary: List concurrency leases (admin).
      description: |
        Lists FR-SESS-3 concurrency leases (`runtime.session_lease`) — the rows
        the per-identity cap is counted from. This is the diagnostic half, and
        the sharper of the two gaps it closes: an identity blocked by a lease
        that outlived its session is refused with the same generic policy denial
        as a real deny, so without this an operator cannot tell the two apart
        until the lease's safety TTL is reaped.

        A lease counts while `countsTowardCap` is true, which is unreleased AND
        unexpired. So a ghost is not "expired but still counted" — an expired
        lease has already stopped counting, and the reaper only tidies the row.
        It is a lease that STILL counts with no live session behind it: compare
        this collection filtered by `identity` with `activeOnly=true` against
        `GET /v1/sessions` filtered the same way, and the difference is the
        over-count. A lease carrying no `expiresAt` counts until something
        releases it, which is the unbounded case. Cursor-paginated.
        Platform-RBAC gated (`audit:read`), the same permission that reads
        `/v1/sessions`.
      tags:
        - session-leases
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: identity
          in: query
          required: false
          description: Filter to one subject identity — the unit the cap is enforced per.
          schema:
            type: string
        - name: activeOnly
          in: query
          required: false
          description: >-
            When true, return only leases that still count toward the cap —
            unreleased, and unexpired or without an expiry. This is exactly the
            predicate the cap evaluates.
          schema:
            type: boolean
      responses:
        '200':
          description: A page of concurrency leases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLeasePage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/session-leases/{sessionLeaseId}:
    parameters:
      - $ref: '#/components/parameters/SessionLeaseId'
    get:
      operationId: getSessionLease
      summary: Get a concurrency lease (admin).
      description: >-
        Returns one lease by id — the confirmation step before releasing it.
        Platform-RBAC gated (`audit:read`).
      tags:
        - session-leases
      responses:
        '200':
          description: The concurrency lease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLeaseResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/session-leases/{sessionLeaseId}/release:
    parameters:
      - $ref: '#/components/parameters/SessionLeaseId'
    post:
      operationId: releaseSessionLease
      summary: Release one concurrency lease (admin, privileged).
      description: |
        Releases ONE stuck lease by id, freeing the slot it occupies. The `reason`
        is required and audited — this is a correction to enforcement state, and
        an unexplained one is indistinguishable after the fact from an operator
        quietly raising somebody's cap. Idempotent: releasing an
        already-released lease is a `200` with the lease unchanged.

        **There is deliberately no bulk form and no release-by-identity
        parameter.** Releasing every lease for an identity trades a bounded
        over-count for an under-count, which lets that identity exceed the cap
        for as long as the real sessions run — a worse failure than the one being
        fixed, and the dangerous shape is therefore not offered at all. Diagnose
        with the collection, then release the specific lease.

        Platform-RBAC gated (`lock:write`), the same permission that terminates a
        session, because both correct live enforcement state.
      tags:
        - session-leases
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseSessionLeaseRequest'
      responses:
        '200':
          description: The released lease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLeaseResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/recordings:
    get:
      operationId: listRecordings
      summary: List session recordings (admin).
      description: |
        Lists session recording metadata (`runtime.recording_ref`; Design §12).
        NEVER returns recording bytes — replay/export issue short-lived signed URLs.
        Optional filters narrow by session, node, and identity. Cursor-paginated.
        Platform-RBAC gated (`recording:replay`).
      tags:
        - recordings
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sessionId
          in: query
          required: false
          description: Filter to one session id.
          schema:
            type: string
            format: uuid
        - name: identity
          in: query
          required: false
          description: Filter to one subject identity.
          schema:
            type: string
        - name: nodeId
          in: query
          required: false
          description: Filter to one node id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A page of recording metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/recordings/{recordingId}:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    get:
      operationId: getRecording
      summary: Get session recording metadata (admin).
      description: |
        Returns one recording's metadata (never bytes). Platform-RBAC gated
        (`recording:replay`).
      tags:
        - recordings
      responses:
        '200':
          description: The recording metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteRecording
      summary: Governance-delete a recording (admin, privileged).
      description: |
        Governance-mode erasure escape hatch (Design §12.2/§12.3, FR-AUD-3/6): a
        specifically-privileged, audited role deletes the encrypted recording object
        and marks the metadata pruned. Platform-RBAC gated (`recording:delete`) +
        audited (FR-PADM-3). Refused (`409`) for a **compliance**-mode recording
        (truly un-deletable, object-lock) or one under **legal hold**. Idempotent —
        `204` whether or not the object was still present.
      tags:
        - recordings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: The recording object was governance-deleted (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/recordings/{recordingId}/replay:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    post:
      operationId: replayRecording
      summary: Issue a replay signed URL (admin).
      description: |
        Issues a short-lived, single-object SIGNED URL for replaying a recording
        (Design §12.2/§18) — bytes NEVER proxy through the CP and the object stays
        customer-key encrypted (the CP cannot decrypt); the access is itself audited
        (FR-AUD-5/FR-PADM-3). Platform-RBAC gated (`recording:replay`), scopable by
        node-label/user/time (FR-PADM-2).
      tags:
        - recordings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: A short-lived signed URL for replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrl'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/recordings/{recordingId}/export:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    post:
      operationId: exportRecording
      summary: Issue an export signed URL (admin).
      description: |
        Issues a short-lived, single-object SIGNED URL for exporting a recording
        (Design §12.2/§18) — bytes NEVER proxy through the CP and the object stays
        customer-key encrypted (the CP cannot decrypt); itself audited (FR-AUD-5).
        Platform-RBAC gated (`recording:export`), scopable (FR-PADM-2).
      tags:
        - recordings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: A short-lived signed URL for export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedUrl'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/recordings/{recordingId}/legal-hold:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    put:
      operationId: setRecordingLegalHold
      summary: Set or release a recording's legal hold (admin, privileged).
      description: |
        Places or releases a legal hold on a recording (Design §12.3, FR-AUD-6). A
        held recording is exempt from retention pruning AND governance delete in
        either WORM mode. Platform-RBAC gated (`recording:delete`) + audited
        (FR-PADM-3). Idempotent by desired state.
      tags:
        - recordings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalHoldRequest'
      responses:
        '200':
          description: The updated recording metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/audit-events:
    get:
      operationId: searchAuditEvents
      summary: Search the correlated audit stream (admin).
      description: |
        Searches the correlated audit stream (`runtime.audit_event`; Design §12,
        FR-AUD-8/9) — one append-only stream for SSH-session and web/admin events,
        correlated by id, newest-first. Search dimensions (FR-AUD-8): identity
        (`actor`), subject, action, outcome, node (`nodeId`) and node label
        (`nodeLabel`), session, source IP, capability, access model, and a time
        range; `correlationId` reconstructs one full path (approve → connect → run →
        replay, FR-AUD-9). Cursor-paginated. Read-only — a search never mutates the
        append-only stream and the hash chain stays verifiable. Platform-RBAC gated
        (`audit:read`); results are additionally filtered to the caller's RBAC scope
        (a node-label/user/time-scoped `audit:read` grant returns only in-scope
        events; an unscoped grant sees all).
      tags:
        - audit-events
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: actor
          in: query
          required: false
          description: Filter by acting identity.
          schema:
            type: string
        - name: subject
          in: query
          required: false
          description: Filter by the subject the action targeted.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Filter by action name (e.g. `lock.create`).
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          description: Filter by outcome.
          schema:
            type: string
        - name: sessionId
          in: query
          required: false
          description: Filter to one session id.
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: query
          required: false
          description: Filter to one node id.
          schema:
            type: string
            format: uuid
        - name: sourceIp
          in: query
          required: false
          description: Filter by source IP.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on occurrence time (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive upper bound on occurrence time (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: capability
          in: query
          required: false
          description: Filter to events whose capability set includes this capability (FR-AUD-8).
          schema:
            $ref: '#/components/schemas/Capability'
        - name: accessModel
          in: query
          required: false
          description: Filter by the session's access model (FR-AUD-8).
          schema:
            $ref: '#/components/schemas/AccessModel'
        - name: nodeLabel
          in: query
          required: false
          description: |
            Filter by a snapshot node label as `key=value` (FR-AUD-8). Repeatable;
            all supplied labels must match (AND).
          schema:
            type: array
            items:
              type: string
              maxLength: 512
        - name: correlationId
          in: query
          required: false
          description: Filter to one correlation id — the FR-AUD-9 full-path join key.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A page of audit events (newest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/audit-events/{auditEventId}:
    parameters:
      - $ref: '#/components/parameters/AuditEventId'
    get:
      operationId: getAuditEvent
      summary: Get one audit event (admin).
      description: |
        Returns one audit event by id. Platform-RBAC gated (`audit:read`).
      tags:
        - audit-events
      responses:
        '200':
          description: The audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC bearer access via an ID/JWT token validated by the Control Plane
        (Design §5.7, FR-AUTH-17). The ID token is the authentication proof.
    clientCredentials:
      type: oauth2
      description: |
        OAuth 2.0 client-credentials for machine consumers (Design §5.6,
        FR-AUTH-12). `private_key_jwt`/mTLS client authentication is preferred
        over static secrets.
      flows:
        clientCredentials:
          tokenUrl: https://controlplane.sessionlayer.example/oauth2/token
          scopes: {}
    mtls:
      type: mutualTLS
      description: |
        Mutual TLS client-certificate authentication (Design §5.7, FR-AUTH-17),
        also used by the internal CP<->Gateway plane.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque forward-only pagination cursor from a previous page's `nextCursor`.
        Omit for the first page. An unrecognised cursor is a `400`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items to return in one page (the server clamps to its maximum).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional client-generated idempotency key scoping a mutating request. A
        retry with the same key, method, and path returns the original response and
        never repeats the side effect; the same key with a different request body is
        a `422`. Keys are retained for a bounded TTL.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaId:
      name: caId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaKindPath:
      name: caKind
      in: path
      required: true
      description: >-
        Which SSH CA to address. The closed set is the three SSH kinds; the
        internal mTLS CA is not a member and any other value is a `400`.
      schema:
        $ref: '#/components/schemas/CaKind'
    ServiceAccountId:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodePolicyId:
      name: nodePolicyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapabilityDefId:
      name: capabilityDefId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JitPolicyId:
      name: jitPolicyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BreakglassPolicyId:
      name: breakglassPolicyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionLimitPolicyId:
      name: sessionLimitPolicyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GatewayId:
      name: gatewayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionLeaseId:
      name: sessionLeaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingId:
      name: recordingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditEventId:
      name: auditEventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An error occurred. The body is an RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      title: RFC 9457 Problem Details
      description: |
        Problem details for HTTP APIs as defined by RFC 9457 (obsoletes RFC 7807).
        Error responses use media type `application/problem+json`.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: A URI reference identifying the specific occurrence.
      additionalProperties: true
    HealthStatus:
      type: object
      title: Health Status
      description: Liveness/readiness result, loosely modelled on the IETF health-check draft.
      required:
        - status
      properties:
        status:
          type: string
          description: Overall health indicator.
          enum:
            - pass
            - fail
            - warn
      additionalProperties: false
    ProtocolVersionRange:
      type: object
      title: Protocol Version Range
      description: An inclusive range of supported protocol versions, `major.minor` strings.
      required:
        - min
        - max
      properties:
        min:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Inclusive lowest supported protocol version, e.g. "1.0".
        max:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Inclusive highest supported protocol version, e.g. "1.0".
      additionalProperties: false
    VersionInfo:
      type: object
      title: Version Info
      description: Component build version and the protocol ranges it negotiates.
      required:
        - component
        - version
        - protocols
      properties:
        component:
          type: string
          description: Formal component name.
        version:
          type: string
          description: Component build version (SemVer 2.0.0).
        protocols:
          type: object
          title: Protocol Ranges
          description: Supported protocol version ranges by plane.
          required:
            - controlPlaneGatewayGrpc
            - agentGatewayWire
          properties:
            controlPlaneGatewayGrpc:
              $ref: '#/components/schemas/ProtocolVersionRange'
            agentGatewayWire:
              $ref: '#/components/schemas/ProtocolVersionRange'
          additionalProperties: false
      additionalProperties: false
    BootstrapClaimRequest:
      type: object
      title: Bootstrap Claim Request
      required:
        - credential
        - subject
      properties:
        credential:
          type: string
          description: >-
            The printed-once bootstrap credential (Design §2A). Its SHA-256
            is compared to the armed hash in constant time; this value is the
            sole authenticator for the call.
        subject:
          type: string
          description: The identity (e.g. OIDC subject) to bind as the first platform admin.
      additionalProperties: false
    BootstrapClaimResult:
      type: object
      title: Bootstrap Claim Result
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - provisioned
            - already_completed
            - not_available
            - invalid_credential
          description: >-
            `not_available` means no credential is currently armed (config-named
            admin or already provisioned by that path). Note: unlike every
            other error response in this contract, this body is a plain JSON
            object, not an RFC 9457 problem document (see `contracts/openapi/README.md`).
      additionalProperties: false
    TokenRequest:
      type: object
      title: OAuth Token Request
      description: |
        Client-credentials token request (Design §5.6). Sent as
        `application/x-www-form-urlencoded`. Client authentication is by
        `client_assertion` (private_key_jwt) or by the mTLS client certificate;
        a static `client_secret` is accepted but discouraged.
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          description: Must be `client_credentials`.
        client_id:
          type: string
        client_assertion_type:
          type: string
          description: 'For private_key_jwt: urn:ietf:params:oauth:client-assertion-type:jwt-bearer.'
        client_assertion:
          type: string
          description: The signed JWT client assertion (RFC 7523).
        client_secret:
          type: string
          description: Discouraged static secret (only if the SA uses client_secret).
        scope:
          type: string
      additionalProperties: false
    TokenResponse:
      type: object
      title: OAuth Token Response
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The short-lived CP-signed bearer token.
        token_type:
          type: string
          description: Always `Bearer`.
        expires_in:
          type: integer
          format: int64
          description: Token lifetime in seconds.
        scope:
          type: string
      additionalProperties: false
    IssueOtpRequest:
      type: object
      title: Issue OTP Request
      required:
        - identity
        - allowedPrincipals
      properties:
        identity:
          type: string
          description: The identity the OTP authenticates (taken from the record, never client input at validation).
        allowedPrincipals:
          type: array
          items:
            type: string
        sourceCidr:
          type: string
          description: Optional source-CIDR binding (deny-only reducer).
        ttlSeconds:
          type: integer
          format: int32
          description: OTP lifetime (60–300s); defaults to the operator setting.
      additionalProperties: false
    IssuedOtp:
      type: object
      title: Issued OTP
      required:
        - otpId
        - otp
        - expiresAt
      properties:
        otpId:
          type: string
          format: uuid
        otp:
          type: string
          description: The raw OTP, returned ONCE for out-of-band delivery; only its hash is stored.
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    CreatePinRequest:
      type: object
      title: Create Pin Request
      required:
        - fingerprint
        - identity
        - principals
        - ttlSeconds
      properties:
        fingerprint:
          type: string
          description: The pinned public-key fingerprint (SHA256:...).
        identity:
          type: string
        sourceCidr:
          type: string
          description: Source-CIDR binding (deny-only reducer, FR-AUTH-15).
        principals:
          type: array
          items:
            type: string
        ttlSeconds:
          type: integer
          format: int64
          description: Pin lifetime; capped at the authorization TTL (FR-AUTH-10).
      additionalProperties: false
    PinResource:
      type: object
      title: Pin
      required:
        - id
        - fingerprint
        - identity
        - principals
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        fingerprint:
          type: string
        identity:
          type: string
        sourceCidr:
          type: string
        principals:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
      additionalProperties: false
    PinList:
      type: object
      title: Pin List
      required:
        - pins
      properties:
        pins:
          type: array
          items:
            $ref: '#/components/schemas/PinResource'
      additionalProperties: false
    IssueServiceAccountCredentialRequest:
      type: object
      title: Issue Service-Account Credential Request
      required:
        - credentialType
      properties:
        credentialType:
          type: string
          enum:
            - private_key_jwt
            - mtls
            - client_secret
        publicKeyPem:
          type: string
          description: For private_key_jwt — the client's public key (PEM). Public material only.
        jwksUri:
          type: string
          description: For private_key_jwt — a JWKS URI reference (alternative to publicKeyPem).
        certificateFingerprint:
          type: string
          description: For mtls — the client certificate SHA-256 fingerprint.
        ttlSeconds:
          type: integer
          format: int64
          description: Credential validity; null = non-expiring until revoked.
      additionalProperties: false
    ServiceAccountCredentialResource:
      type: object
      title: Service-Account Credential
      required:
        - id
        - serviceAccountId
        - credentialType
        - status
        - issuedAt
      properties:
        id:
          type: string
          format: uuid
        serviceAccountId:
          type: string
          format: uuid
        credentialType:
          type: string
        fingerprint:
          type: string
        clientSecret:
          type: string
          description: For client_secret — the raw secret, returned ONCE; only its hash is stored.
        status:
          type: string
        issuedAt:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
      additionalProperties: false
    BeginDeviceFlowRequest:
      type: object
      title: Begin Device Flow Request
      properties:
        sourceIp:
          type: string
          description: The SSH source IP to bind for anti-phishing correlation (§5.2).
        connectionBinding:
          type: string
          description: An opaque 1:1 device-code↔connection binding value.
      additionalProperties: false
    DeviceFlowResource:
      type: object
      title: Device Flow
      required:
        - deviceFlowId
        - userCode
        - verificationUri
        - deviceCode
        - interval
        - expiresIn
      properties:
        deviceFlowId:
          type: string
          format: uuid
        userCode:
          type: string
          description: The short code the user enters at the verification page.
        verificationUri:
          type: string
          description: The CP-hosted verification page URL.
        verificationUriComplete:
          type: string
          description: Verification URI with the user code embedded (convenience).
        deviceCode:
          type: string
          description: The opaque device code the caller polls with (its own credential).
        interval:
          type: integer
          format: int32
          description: Minimum poll interval in seconds.
        expiresIn:
          type: integer
          format: int64
          description: Seconds until the flow expires.
      additionalProperties: false
    PollDeviceFlowRequest:
      type: object
      title: Poll Device Flow Request
      required:
        - deviceCode
      properties:
        deviceCode:
          type: string
      additionalProperties: false
    DeviceFlowStatus:
      type: object
      title: Device Flow Status
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - authorized
            - denied
            - expired
        identity:
          type: string
          description: The resolved identity, present when status=authorized.
        sourceContextMatch:
          type: boolean
          description: Whether the approving browser source correlated with the SSH source (§5.2).
      additionalProperties: false
    LockMode:
      type: string
      title: Lock Mode
      description: |
        Lock enforcement mode (Design §8.3). `strict` tears down matching live
        sessions and blocks new ones; `best_effort` blocks new issuance but does
        not forcibly tear down an already-established session.
      enum:
        - strict
        - best_effort
    LockTarget:
      type: object
      title: Lock Target
      description: |
        What the lock matches (LockMatching facets; OR-matched). At least one
        facet must be non-empty, OR `all` must be true — a global lock is never
        implicit (ingest rejects an empty target).
      properties:
        identities:
          type: array
          items:
            type: string
          description: Resolved subject identities to deny.
        groups:
          type: array
          items:
            type: string
          description: SSO/OIDC groups to deny (membership match).
        nodeIds:
          type: array
          items:
            type: string
            format: uuid
          description: Target node ids to deny.
        principals:
          type: array
          items:
            type: string
          description: Linux logins (principals) to deny.
        nodeLabels:
          type: array
          items:
            type: string
          description: Node labels ("key=value") to deny.
        all:
          type: boolean
          description: An explicit fleet-wide lock (deny everything). Required for a target with no other facet.
      additionalProperties: false
    CreateLockRequest:
      type: object
      title: Create Lock Request
      required:
        - target
        - reason
      properties:
        target:
          $ref: '#/components/schemas/LockTarget'
        reason:
          type: string
          description: Operator/audit reason (mandatory). Never disclosed to the SSH user (§7.1).
        mode:
          $ref: '#/components/schemas/LockMode'
          description: Enforcement mode; omitted defaults to `strict` (backward-compatible).
        ttlSeconds:
          type: integer
          format: int64
          description: Optional lock lifetime in seconds; omitted or null = no expiry (indefinite until released).
      additionalProperties: false
    LockResource:
      type: object
      title: Lock
      required:
        - id
        - target
        - reason
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        target:
          $ref: '#/components/schemas/LockTarget'
        reason:
          type: string
        mode:
          $ref: '#/components/schemas/LockMode'
          description: Enforcement mode (`strict` or `best_effort`).
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry; absent when the lock has no TTL.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: The admin identity that created the lock.
      additionalProperties: false
    LockList:
      type: object
      title: Lock List
      required:
        - locks
      properties:
        locks:
          type: array
          items:
            $ref: '#/components/schemas/LockResource'
      additionalProperties: false
    IssueJoinTokenRequest:
      type: object
      title: Issue Join Token Request
      description: Request to mint a single-use agent join token bound to a node.
      required:
        - nodeName
      properties:
        nodeName:
          type: string
          minLength: 1
          maxLength: 253
          description: >-
            The stable node identity the token authorizes an agent to join as
            (FR-JOIN-6). The token is scoped to exactly this node.
        ttlSeconds:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Optional TTL override (seconds). Omitted uses the configured default;
            the value is clamped to the configured maximum. Join tokens are
            short-lived by design.
      additionalProperties: false
    IssuedJoinToken:
      type: object
      title: Issued Join Token
      description: >-
        A freshly issued join token. The `token` field is the raw single-use
        bearer value and is returned exactly ONCE; only its hash is stored.
      required:
        - id
        - token
        - nodeName
        - joinMethod
        - singleUse
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: The raw single-use join token. Shown once; never retrievable again.
        nodeName:
          type: string
        joinMethod:
          type: string
          enum:
            - token
        singleUse:
          type: boolean
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    JoinTokenResource:
      type: object
      title: Join Token
      description: Join-token metadata (never the raw token).
      required:
        - id
        - nodeName
        - joinMethod
        - singleUse
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        nodeName:
          type: string
        joinMethod:
          type: string
          enum:
            - token
        singleUse:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: The admin identity that issued the token.
      additionalProperties: false
    JoinTokenList:
      type: object
      title: Join Token List
      required:
        - joinTokens
      properties:
        joinTokens:
          type: array
          items:
            $ref: '#/components/schemas/JoinTokenResource'
      additionalProperties: false
    IssueGatewayEnrollmentTokenRequest:
      type: object
      title: Issue Gateway Enrollment Token Request
      description: Request to mint a single-use enrollment token bound to a Gateway.
      required:
        - gatewayName
      properties:
        gatewayName:
          type: string
          minLength: 1
          maxLength: 253
          description: >-
            The stable Gateway name the token authorises an enrollment as. The
            token is scoped to exactly this name; enrolling under any other name
            is refused (FR-JOIN-3).
        ttlSeconds:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Optional TTL override (seconds). Omitted uses the configured default;
            the value is clamped to the configured maximum. Enrollment tokens are
            short-lived by design.
      additionalProperties: false
    IssuedGatewayEnrollmentToken:
      type: object
      title: Issued Gateway Enrollment Token
      description: >-
        A freshly issued Gateway enrollment token. The `token` field is the raw
        single-use bearer value and is returned exactly ONCE; only its hash is
        stored, so it can never be read back.
      required:
        - id
        - token
        - gatewayName
        - singleUse
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: The raw single-use enrollment token. Shown once; never retrievable again.
        gatewayName:
          type: string
        singleUse:
          type: boolean
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    GatewayEnrollmentTokenResource:
      type: object
      title: Gateway Enrollment Token
      description: Enrollment-token metadata (never the raw token).
      required:
        - id
        - gatewayName
        - singleUse
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        gatewayName:
          type: string
        singleUse:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: The admin identity that issued the token.
      additionalProperties: false
    GatewayEnrollmentTokenList:
      type: object
      title: Gateway Enrollment Token List
      required:
        - gatewayEnrollmentTokens
      properties:
        gatewayEnrollmentTokens:
          type: array
          items:
            $ref: '#/components/schemas/GatewayEnrollmentTokenResource'
      additionalProperties: false
    MtlsTrustAnchor:
      type: object
      title: Internal mTLS CA Trust Anchor
      description: >-
        The active internal mTLS CA certificate — public material only. No
        private key, key reference, or wrapped material appears here or can be
        derived from it.
      required:
        - pem
        - fingerprintSha256
        - subject
        - notBefore
        - notAfter
      properties:
        pem:
          type: string
          description: The X.509 CA certificate, PEM-encoded.
        fingerprintSha256:
          type: string
          description: >-
            Lowercase hex SHA-256 over the certificate DER, for out-of-band
            verification that the anchor an operator installed is the one the
            Control Plane serves.
        subject:
          type: string
          description: The certificate's subject distinguished name.
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
          description: >-
            When the anchor expires. Every enrolled Gateway must be re-anchored
            before this instant.
      additionalProperties: false
    GatewayResource:
      type: object
      title: Gateway Identity
      description: >-
        An enrolled Gateway's identity METADATA. NEVER carries a certificate, a
        key reference, or key material — the mTLS identity reference is outside
        this projection and cannot be derived from it.
      required:
        - id
        - name
        - generation
        - joinMethod
        - status
        - presenceNodeCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: >-
            The stable Gateway name. Removal frees it for re-enrollment, and node
            presence records the OWNER BY NAME, so a name reused after a removal
            inherits whatever presence still refers to it.
        fingerprintSha256:
          type: string
          description: >-
            Lowercase hex SHA-256 over the current mTLS identity certificate's
            DER. A mismatch against what the Gateway actually holds — the usual
            after-restore symptom — is visible here.
        prevFingerprintSha256:
          type: string
          description: >-
            The previous identity certificate's digest, retained across renewal.
            The Control Plane admits a caller matching EITHER this or the current
            fingerprint, so a Gateway presenting this one is mid-renewal and
            healthy. Without it a mismatch is ambiguous, and the two readings call
            for opposite actions: leave it alone, or free the name and re-enroll.
            Removing a Gateway that was fine is the expensive mistake here, which
            is why the field is on the resource that informs that decision.
        generation:
          type: integer
          format: int64
          description: >-
            Renewal generation counter. A credential presenting an older
            generation is a stale clone and is refused.
        joinMethod:
          type: string
          enum:
            - token
            - oidc
            - mtls
        status:
          type: string
          enum:
            - active
            - locked
            - revoked
        issuedAt:
          type: string
          format: date-time
          description: When the CURRENT identity certificate was issued; a renewal moves it.
        notAfter:
          type: string
          format: date-time
          description: When the current identity certificate expires.
        presenceNodeCount:
          type: integer
          format: int32
          minimum: 0
          description: >-
            How many node control channels this Gateway currently owns. Non-zero
            means removing it strands those nodes until another Gateway claims
            presence, which is why removal refuses without `force`.
        presenceLastSeenAt:
          type: string
          format: date-time
          description: The most recent presence heartbeat from this Gateway; absent if it owns nothing.
        createdAt:
          type: string
          format: date-time
          description: When the Gateway first enrolled.
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    GatewayPage:
      type: object
      title: Gateway Page
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GatewayResource'
        nextCursor:
          type: string
          description: Cursor for the next page; absent on the last page.
      additionalProperties: false
    RegisterNodeRequest:
      type: object
      title: Register Node Request
      description: |
        Enrol an agentless node. `address` (host:port) is required; at least one of
        `hostCertificate` / `pinnedHostKey` is required (host-identity anchor — no
        TOFU, §9.3).
      required:
        - name
        - address
      properties:
        name:
