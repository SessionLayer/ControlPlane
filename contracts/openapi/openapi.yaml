        gatewayId:
          type: string
          format: uuid
        gatewayName:
          type: string
        accessModel:
          $ref: '#/components/schemas/AccessModel'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        matchedRuleId:
          type: string
          format: uuid
        matchedRuleName:
          type: string
        jitRequestId:
          type: string
          format: uuid
        breakglassActivationId:
          type: string
          format: uuid
        policyEpoch:
          type: integer
          format: int64
        grantExpiry:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
      additionalProperties: false
    TerminateSessionRequest:
      type: object
      title: Terminate Session Request
      properties:
        reason:
          type: string
          maxLength: 4096
          description: |
            Operator/audit reason (never disclosed to the SSH user). Bounded like a
            Lock reason (it becomes one) so it cannot inflate the pushed deny-list.
      additionalProperties: false
    SessionPage:
      type: object
      title: Session Page
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionResource'
        nextCursor:
          type: string
      additionalProperties: false
    # ============ session-leases (session_lease, runtime) ============
    SessionLeaseResource:
      type: object
      title: Concurrency Lease
      description: >-
        One FR-SESS-3 concurrency lease. The per-identity cap counts the leases
        that are unreleased AND unexpired, so a lease outliving its session keeps
        occupying a slot until it is released or its safety TTL passes.
      required:
        - id
        - identity
        - acquiredAt
        - countsTowardCap
      properties:
        id:
          type: string
          format: uuid
        identity:
          type: string
          description: The subject identity the cap is enforced per.
        sessionId:
          type: string
          format: uuid
          description: >-
            The session that took the lease; absent if that session's row has
            since been pruned, which is itself a sign of a stuck lease.
        gatewayName:
          type: string
          description: >-
            The Gateway that took the lease, by NAME. A lease held by a Gateway
            that no longer exists cannot be released by its owner and is the
            usual reason one gets stuck.
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: >-
            The lease safety TTL. Once it passes, the lease stops counting
            immediately and the reaper later stamps `releasedAt` to tidy the row.
            ABSENT means no TTL — the lease counts until something releases it,
            which is the only unbounded case.
        releasedAt:
          type: string
          format: date-time
          description: >-
            When the lease was released, by a session ending, by an operator, or
            by the reaper. Absent while unreleased — which is not the same as
            counting, since an expired lease is unreleased and uncounted.
        countsTowardCap:
          type: boolean
          description: >-
            Whether this lease is counted right now by the cap query, which
            evaluates unreleased AND (no expiry OR expiry in the future). An
            expired-but-unreleased lease does NOT count — it has already stopped
            occupying the slot, and `releasedAt` merely catches up later.
      additionalProperties: false
    ReleaseSessionLeaseRequest:
      type: object
      title: Release Session Lease Request
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Operator/audit reason, REQUIRED. Releasing a lease corrects live
            enforcement state, and an unexplained release is indistinguishable
            afterwards from an operator quietly granting somebody extra capacity.
      additionalProperties: false
    SessionLeasePage:
      type: object
      title: Session Lease Page
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionLeaseResource'
        nextCursor:
          type: string
          description: Cursor for the next page; absent on the last page.
      additionalProperties: false
    RecordingResource:
      type: object
      title: Recording
      description: Session recording metadata (Design §12). NEVER carries recording bytes.
      required:
        - id
        - sessionId
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        identity:
          type: string
          description: The session subject identity (the recorded user).
        nodeId:
          type: string
          format: uuid
        format:
          type: string
          description: Capture format (e.g. `asciicast-v2`).
        status:
          type: string
          description: Lifecycle status (`recording|finalized|truncated|failed`).
        wormMode:
          type: string
          description: WORM object-lock mode (`compliance|governance`).
        sizeBytes:
          type: integer
          format: int64
        hashChainHead:
          type: string
          description: The tamper-evidence hash-chain head (hex).
        encryptionKeyRef:
          type: string
          description: A reference to the customer-held encryption key — NEVER key material.
        legalHold:
          type: boolean
        retentionUntil:
          type: string
          format: date-time
        prunedAt:
          type: string
          format: date-time
          description: When the encrypted object was deleted (retention prune or governance delete); metadata is retained.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    LegalHoldRequest:
      type: object
      title: Legal Hold Request
      description: Places or releases a legal hold on a recording (FR-AUD-6).
      required:
        - held
      properties:
        held:
          type: boolean
          description: True to place a legal hold, false to release it.
        reason:
          type: string
          maxLength: 4096
      additionalProperties: false
    RecordingPage:
      type: object
      title: Recording Page
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecordingResource'
        nextCursor:
          type: string
      additionalProperties: false
    SignedUrl:
      type: object
      title: Signed URL
      description: A short-lived, single-object signed URL. Bytes never proxy through the CP.
      required:
        - url
        - method
        - expiresAt
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          description: The HTTP method to use against the signed URL (e.g. `GET`).
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    AuditEventResource:
      type: object
      title: Audit Event
      description: |
        One row of the correlated append-only audit stream (Design §12).

        `seq`, `prevHash` and `recordHash` are the tamper-evidence chain, and
        they are present ONLY for an unscoped `audit:read` binding. A
        scope-filtered reader gets the row without them, because `seq` is a dense
        global ordinal: a reader who sees `seq` 1000 then 1007 has learned that
        six events exist that they are not entitled to see, and the linkage would
        not resolve for them anyway. Their absence is therefore normal, not an
        error — treat all three as optional.
      required:
        - id
        - occurredAt
        - actor
        - action
        - outcome
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
        subject:
          type: string
        action:
          type: string
        outcome:
          type: string
        sessionId:
          type: string
          format: uuid
        nodeId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        sourceIp:
          type: string
        capabilities:
          type: array
          items:
            type: string
          description: The session's capability snapshot (FR-AUD-8 search dimension).
        accessModel:
          $ref: '#/components/schemas/AccessModel'
        nodeLabels:
          $ref: '#/components/schemas/LabelMap'
        detail:
          $ref: '#/components/schemas/Selector'
        seq:
          type: integer
          format: int64
          description: >-
            Dense chain ordinal assigned by the datastore. Gaps across a page
            mean rows are missing from the stream. Unscoped `audit:read` only.
        prevHash:
          type: string
          description: >-
            The preceding row's `recordHash`, or 64 zeroes at the genesis row.
            Walking `prevHash[n+1] == recordHash[n]` proves the returned rows are
            contiguous and unreordered. Unscoped `audit:read` only.
        recordHash:
          type: string
          description: >-
            This row's chain hash, lowercase hex. Recomputing it independently
            requires reproducing the server's canonical encoding of the event
            byte-for-byte, which this contract does not specify; over the API the
            reliable checks are linkage and `seq` density. Unscoped `audit:read`
            only.
      additionalProperties: false
    AuditEventPage:
      type: object
      title: Audit Event Page
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResource'
        nextCursor:
          type: string
      additionalProperties: false
