openapi: 3.1.0
info:
  title: SessionLayer Control Plane API
  version: 0.1.0
  summary: Contract-first REST surface for the SessionLayer Control Plane.
  description: |
    The **SessionLayer Control Plane API** is the contract-first source of truth
    for the platform's REST surface (Design §13, FR-API-1). The UI is a *client* of
    this contract; server interfaces and typed clients are code-generated from this
    document, and CI fails if generated code drifts from the spec. Postgres is the
    single source of truth; the UI and the API share one write path (D11).

    **Complete contract.** This document is the complete resource surface: the
    config resources (`node-policies`, `rules`, `roles` + `role-bindings`, `cas`,
    `capability-defs`, `jit-policies`, `breakglass-policies`,
    `service-accounts`, `session-limit-policies`, `operator-settings`), the
    runtime resources (`nodes`, `gateways`, `sessions`, `session-leases`,
    `locks`, `jit-requests`, `join-tokens`, `otp`, device-flow, `pins`,
    `breakglass`, `recordings`, `audit-events`), and the operational probes.

    **Config vs runtime.** Config resources carry an `origin` provenance label
    (`api|ui|default`) and an optimistic-concurrency `version`; runtime resources
    (locks, sessions, issuance, audit) are never provenance-labelled. `locks` is an
    API-only runtime resource (Design §13).

    **Conventions.** URI versioning (`/v1`); cursor pagination on collections;
    `Idempotency-Key` on mutating operations; RFC 9457 `application/problem+json`
    errors. See `contracts/VERSIONING.md` for the URI-versioning and N-1
    compatibility policy.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
  contact:
    name: SessionLayer
    url: https://github.com/SessionLayer
servers:
  - url: https://{host}
    description: Control Plane public base URL.
    variables:
      host:
        default: controlplane.sessionlayer.example
        description: The operator-configured Control Plane hostname.
tags:
  - name: meta
    description: Liveness, readiness, and version metadata probes. Public and unauthenticated.
  - name: bootstrap
    description: >-
      First-admin bootstrap (Design §2A; FR-BOOT-2). Single-use claim of a
      printed-once credential, seeding the initial `platform-admin`
      role-binding; self-disables once a platform admin exists. Public — like
      the device-flow poll endpoint, the credential itself is the
      authenticator, not a bearer/mTLS scheme.
  - name: auth
    description: >-
      Runtime credential issuance and revocation (Design §5; FR-AUTH-9/10/12) —
      machine tokens, OTPs, public-key pins, service-account credentials, and the
      OIDC device flow. These are the ISSUED credentials; the definitions they
      belong to live under `service-accounts`. Gating varies by operation and is
      stated on each: `POST /v1/oauth2/token` and `POST /v1/auth/device` carry
      their own security schemes, and `POST /v1/auth/device/poll` is public
      because the device code is itself the authenticator.
  - name: nodes
    description: >-
      Node lifecycle — agentless enrollment, listing, quarantine (a Lock),
      and remove (deregister + agent-credential revoke) (Design §9/§12A;
      FR-NODE-1/2/3). Platform-RBAC gated (`node:enroll`/`node:quarantine`/
      `node:remove`) and audited; provisioning is an API flow.
  - name: locks
    description: Incident-response lock CRUD (Design §8.3). Platform-RBAC gated and audited.
  - name: join-tokens
    description: >-
      Agent join-token issuance & CRUD (Design §8.1; FR-JOIN-2). Single-use,
      self-destruct, short-TTL, node-scoped. Platform-RBAC gated (`node:enroll`)
      and audited, so an autoscaler/config-mgmt re-provisions an agent without a
      human (the GitHub-Actions-runner pattern).
  - name: gateway-enrollment-tokens
    description: >-
      Gateway enrollment-token issuance & revocation (Design §4.B; FR-JOIN-3).
      Single-use, short-TTL, scoped to one Gateway name. Platform-RBAC gated
      (`gateway:enroll`) and audited, so bringing up a Gateway needs an API
      credential rather than a database one. Paired with
      `GET /v1/cas/mtls/trust-anchor`, which exports the trust anchor the
      Gateway pins.
  - name: gateways
    description: >-
      Enrolled Gateway identities (`runtime.gateway_identity`; Design §4.B,
      FR-BOOT-3). Metadata only — NEVER certificates and never key material.
      Reads gated (`gateway:enroll`), matching `nodes`, whose list is gated
      `node:enroll` rather than the generic reader: names, fingerprints and node
      ownership are fleet-targeting metadata. Removal, which frees the name for
      re-enrollment, is gated (`gateway:remove`) + audited — enrollment and
      removal are separate verbs for the same reason `node:enroll` and
      `node:remove` are.
  - name: jit-requests
    description: >-
      Just-in-time access requests & approval chain (Design §7; FR-ACC-2/3/4).
      Submit is open to any authenticated principal; approve/deny/revoke are
      platform-RBAC gated (`request:approve`). Self-approval is impossible;
      revoking an active grant also tears down live sessions via a Lock. Audited.
  - name: breakglass
    description: >-
      Break-glass credential management & activation review (Design §7; FR-ACC-6).
      Register FIDO2 `sk-ecdsa` public keys / issue single-use offline codes
      (platform-RBAC gated `breakglass:manage`); list activations and record the
      mandatory post-hoc review. Audited.
  - name: rules
    description: >-
      Data-plane RBAC rule CRUD (`config.dp_rule`, Design §6.1; FR-AUTHZ-1/API-2).
      Config resource; platform-RBAC gated (`rbac:read`/`rbac:write`) + audited,
      invalid config rejected pre-commit.
  - name: roles
    description: >-
      Platform-RBAC role CRUD (`config.platform_role`; FR-PADM-1/API-2). Named sets
      of the closed permission vocabulary; gated (`rbac:read`/`rbac:write`) + audited.
  - name: role-bindings
    description: >-
      Platform role-binding CRUD (`config.role_binding`; FR-PADM-2/API-2). Binds a
      subject to a role, optionally scoped; gated (`rbac:read`/`rbac:write`) + audited.
  - name: cas
    description: >-
      Certificate-authority config CRUD + rotation (`config.ca_config`;
      FR-CA-1/4/7/API-2). NEVER exposes private key material; gated
      (`ca:manage`/`ca:rotate`) + audited. Two read-only siblings export PUBLIC
      verification material for the components that must pin it — the internal
      mTLS trust anchor (`gateway:enroll`) and an SSH CA's public key
      (`node:enroll`) — deliberately gated on the enrollment permission the job
      needs rather than on CA administration.
  - name: service-accounts
    description: >-
      Machine-consumer definition CRUD (`config.service_account`; FR-AUTH-12/API-2).
      NEVER exposes a secret; gated (`user:manage`) + audited. Issued runtime
      credentials live under the `auth` tag.
  - name: node-policies
    description: >-
      Node-policy CRUD (`config.node_policy`; Design §12A/API-2). Desired labels,
      connector kind, host-trust refs; gated (`settings:write`) + audited.
  - name: capability-defs
    description: >-
      Requestable-capability catalogue CRUD (`config.capability_def`; Design
      §12A/API-2). Gated (`settings:write`) + audited.
  - name: jit-policies
    description: >-
      JIT-policy CRUD (`config.jit_policy`; FR-ACC-3/API-2). Requestable targets +
      0-3 level approval chain; gated (`settings:write`) + audited.
  - name: breakglass-policies
    description: >-
      Break-glass-policy CRUD (`config.breakglass_policy`; FR-ACC-6/API-2). Gated
      (`breakglass:manage`) + audited.
  - name: session-limit-policies
    description: >-
      Session-limit-policy CRUD (`config.session_limit_policy`; FR-SESS-3/API-2).
      Per-identity overrides for the concurrent-session cap, max session
      duration, and idle timeout — enforced at Authorize (cap + duration) and
      the Gateway (idle, signed into the decision context). Reads gated
      (`rbac:read`); writes gated (`settings:write`) + audited.
  - name: operator-settings
    description: >-
      Cluster-wide operator settings (`config.operator_settings`; Design §13,
      FR-PADM-1/API-2) — retention/WORM/OTP defaults, the session-limit cluster
      defaults, and the customer recording key. A DB-enforced singleton, so the
      shape is `GET`/`PUT` on one resource rather than a collection. Reads gated
      (`rbac:read`); writes gated (`settings:write`) + audited; the recording key
      is a sub-resource of its own gated (`recording:key-manage`). The
      key-encryption-key reference and the bootstrap fields are never exposed,
      and the evidence-retention knobs ratchet one way only.
  - name: sessions
    description: >-
      Runtime SSH-session management (`runtime.ssh_session`; Design §12A). List +
      get (`audit:read`); terminate pushes a Lock (`lock:write`) + audited.
  - name: session-leases
    description: >-
      Concurrency-lease diagnosis and release (`runtime.session_lease`;
      FR-SESS-3). A lease that outlives its session still occupies a slot, and
      the resulting refusal reaches the user as a generic policy denial — so the
      read half is the diagnostic that tells an over-count apart from a real
      deny. A lease counts while it is unreleased AND unexpired, so the ghost to
      look for is one that still counts with no live session behind it. Read
      gated (`audit:read`) like `sessions`; release gated (`lock:write`) +
      audited, one lease at a time and never in bulk.
  - name: recordings
    description: >-
      Session-recording admin surface (Design §12/§18; FR-AUD-5/6, FR-PADM-2).
      List/get + replay/export short-lived signed URLs (bytes never proxy through
      the CP; the object stays customer-key encrypted) gated
      (`recording:replay`/`recording:export`, scopable); legal-hold + governance
      delete gated (`recording:delete`) + audited.
  - name: audit-events
    description: >-
      Correlated audit-stream search (`runtime.audit_event`; Design §12,
      FR-AUD-8/9). Gated (`audit:read`), RBAC-scope-filtered, read-only.
# Default security applied to operations that do not override it. The public
# meta probes below explicitly opt out with `security: []`. Declaring the three
# first-class schemes here (Design §13, FR-AUTH-17) fixes them in the contract.
security:
  - oidcBearer: []
  - clientCredentials: []
  - mtls: []
paths:
  /v1/healthz:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe.
      description: |
        Reports whether the Control Plane is able to serve requests. Intended for
        load balancers and orchestrators. Public and unauthenticated; it MUST NOT
        disclose any identity, node, or policy information.
      tags:
        - meta
      security: []
      responses:
        '200':
          description: The Control Plane is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                healthy:
                  value:
                    status: pass
        '503':
          description: The Control Plane is not ready to serve requests.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '4XX':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/version:
    get:
      operationId: getVersion
      summary: Component and protocol version metadata.
      description: |
        Returns the Control Plane component name, its build version (SemVer), and
        the protocol version ranges it speaks on the CP<->Gateway gRPC plane and
        the Agent<->Gateway wire protocol. Public and unauthenticated.
      tags:
        - meta
      security: []
      responses:
        '200':
          description: Version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
              examples:
                current:
                  value:
                    component: SessionLayer Control Plane
                    version: 0.1.0
                    protocols:
                      controlPlaneGatewayGrpc:
                        min: '1.0'
                        max: '1.0'
                      agentGatewayWire:
                        min: '1.0'
                        max: '1.0'
        '4XX':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/bootstrap/claim:
    post:
      operationId: claimBootstrap
      summary: Claim the printed-once first-admin bootstrap credential.
      description: |
        Surrenders the credential printed once to the CP's own log at cold
        start, binding `subject` as the initial `platform-admin` (Design §2A,
        FR-BOOT-2). Public and unauthenticated by scheme — the credential
        itself is the authenticator, matching `POST /v1/auth/device/poll`'s
        opaque-device-code model. Single-use: the underlying
        `operator_settings.bootstrap_completed` flip is a single
        conditional-UPDATE row lock, so a concurrent second claim (whether or
        not it knows the correct credential) always observes
        `already_completed`, never a second provision. Self-disables
        entirely once any platform admin exists (a config-named admin
        subject, or a prior successful claim) — no credential is ever armed
        again, so this operation can succeed at most once per deployment.
        Every attempt is audited, including invalid-credential attempts.
      tags:
        - bootstrap
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapClaimRequest'
      responses:
        '200':
          description: The credential was valid; the caller is now the first admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapClaimResult'
              examples:
                provisioned:
                  value:
                    status: provisioned
        '401':
          description: The credential did not match the armed hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapClaimResult'
              examples:
                invalidCredential:
                  value:
                    status: invalid_credential
        '409':
          description: >-
            Bootstrap already completed (by this or a concurrent claim), or no
            credential is currently armed (a config-named admin subject was
            used instead, or the credential was never printed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapClaimResult'
              examples:
                alreadyCompleted:
                  value:
                    status: already_completed
        default:
          $ref: '#/components/responses/Problem'
  /v1/oauth2/token:
    post:
      operationId: issueMachineToken
      summary: OAuth 2.0 client-credentials token endpoint (machine identity).
      description: |
        Machine consumers exchange a client credential — a `private_key_jwt`
        client assertion (RFC 7523) or a mutual-TLS client certificate,
        preferred over a static secret — for a short-lived CP-signed bearer
        token (Design §5.6, FR-AUTH-12). The token resolves to a first-class
        RBAC principal. The client authenticates itself here, so the endpoint is
        not behind the bearer/mTLS API gate; the `clientCredentials`/`mtls`
        schemes below document the accepted client-authentication methods.
      tags:
        - auth
      security:
        - clientCredentials: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: An access token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/otp:
    post:
      operationId: issueOtp
      summary: Issue a single-use OTP for an identity (admin).
      description: |
        Server-generates a single-use, short-TTL OTP bound to an identity and
        allowed principals (Design §5.4, FR-AUTH-9). The raw OTP is returned once
        (for out-of-band delivery); only its hash is stored. Platform-RBAC gated
        (`user:manage`) and audited.
      tags:
        - auth
      responses:
        '201':
          description: An OTP was issued (raw value returned once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedOtp'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueOtpRequest'
  /v1/pins:
    get:
      operationId: listPins
      summary: List pins for an identity (admin).
      tags:
        - auth
      parameters:
        - name: identity
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The identity's pins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPin
      summary: Create an authN-shortcut pin (admin).
      description: |
        Pins a public-key fingerprint to `{identity, source-cidr, principals}`
        with a TTL capped at the authorization TTL (Design §5.5, FR-AUTH-10).
        Source IP is a deny-only reducer. Platform-RBAC gated + audited.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePinRequest'
      responses:
        '201':
          description: The pin was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/pins/{pinId}:
    delete:
      operationId: revokePin
      summary: Revoke a pin (admin / offboarding / lock).
      tags:
        - auth
      parameters:
        - name: pinId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The pin was revoked (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/service-accounts/{serviceAccountId}/credentials:
    post:
      operationId: issueServiceAccountCredential
      summary: Issue a machine-consumer credential (admin).
      description: |
        Issues a rotatable, revocable credential for a service account
        (FR-AUTH-12): a `private_key_jwt` public-key/JWKS reference, an mTLS
        certificate fingerprint, or (discouraged) a generated `client_secret`
        returned once. Stored hashed / by reference. Platform-RBAC gated +
        audited.
      tags:
        - auth
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueServiceAccountCredentialRequest'
      responses:
        '201':
          description: The credential was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountCredentialResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/service-accounts/{serviceAccountId}/credentials/{credentialId}:
    delete:
      operationId: revokeServiceAccountCredential
      summary: Revoke a machine-consumer credential (admin).
      description: Revocation takes effect immediately (new sessions denied, FR-AUTH-12).
      tags:
        - auth
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The credential was revoked (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/device:
    post:
      operationId: beginDeviceFlow
      summary: Begin an OIDC device-authorization flow (RFC 8628).
      description: |
        Starts a device flow bound to the SSH source context (Design §5.2,
        FR-AUTH-3). Returns the user code + CP verification URI to present to the
        user, and the device code the caller polls with. Fallback-only. The
        caller is the Gateway (mTLS).
      tags:
        - auth
      security:
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginDeviceFlowRequest'
      responses:
        '201':
          description: A device flow was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceFlowResource'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/auth/device/poll:
    post:
      operationId: pollDeviceFlow
      summary: Poll a device flow for completion (RFC 8628).
      description: |
        Polls with the opaque device code (its own credential). Returns
        `pending` until the user approves at the verification page, then
        `authorized` with the resolved identity, or `denied`/`expired`. Public
        (the device code is the authenticator); rate-limited.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollDeviceFlowRequest'
      responses:
        '200':
          description: The current device-flow status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceFlowStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/locks:
    get:
      operationId: listLocks
      summary: List active locks (admin).
      description: |
        Lists the current unexpired locks. Platform-RBAC gated (`lock:read`) +
        audited (Design §8.3; FR-LOCK-1). A lock is the incident-response deny
        primitive; the deny reason is operator-only.
      tags:
        - locks
      responses:
        '200':
          description: The active locks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLock
      summary: Create a lock (admin).
      description: |
        Creates an incident-response lock that blocks new session issuance AND
        tears down existing matching sessions on every Gateway (Design §8.3,
        §8.4; FR-LOCK-1/2), pushed over the actively-pushed deny-list. Ingest
        validation rejects an empty/unrecognised target; a fleet-wide lock
        requires an explicit `all: true`. Platform-RBAC gated (`lock:write`) +
        audited.
      tags:
        - locks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLockRequest'
      responses:
        '201':
          description: The lock was created and pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/locks/{lockId}:
    delete:
      operationId: releaseLock
      summary: Release a lock (admin).
      description: |
        Releases (deletes) a lock; the removal is pushed to every Gateway.
        Releasing a lock only stops future denial — it never resurrects a
        torn-down session. Platform-RBAC gated (`lock:write`) + audited.
      tags:
        - locks
      parameters:
        - name: lockId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The lock was released (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/join-tokens:
    get:
      operationId: listJoinTokens
      summary: List active join tokens (admin).
      description: |
        Lists the current unconsumed, unexpired join tokens. The raw token value
        is NEVER returned (only its metadata) — it is shown exactly once at
        issuance. Platform-RBAC gated (`node:enroll`) + audited (Design §8.1;
        FR-JOIN-2).
      tags:
        - join-tokens
      responses:
        '200':
          description: The active join tokens (metadata only, never the raw token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinTokenList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: issueJoinToken
      summary: Issue an agent join token (admin).
      description: |
        Issues a short-lived, single-use, self-destruct join token bound to a
        stable node identity/scope (Design §8.1; FR-JOIN-2/6). The raw token is
        returned exactly ONCE (for out-of-band delivery to the joining Agent);
        only its SHA-256 hash is stored. Because issuance is a pure API
        operation, an autoscaler/config-mgmt re-provisions a token-join agent
        after a full lapse without a human. Platform-RBAC gated (`node:enroll`)
        + audited.
      tags:
        - join-tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueJoinTokenRequest'
      responses:
        '201':
          description: A join token was issued (raw value returned once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedJoinToken'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/join-tokens/{joinTokenId}:
    delete:
      operationId: revokeJoinToken
      summary: Revoke a join token (admin).
      description: |
        Revokes (deletes) an unconsumed join token so it can never be used.
        Idempotent. Revoking an already-consumed token has no effect on the
        identity it produced (revocation of an issued identity is a Lock, §8.1).
        Platform-RBAC gated (`node:enroll`) + audited.
      tags:
        - join-tokens
      parameters:
        - name: joinTokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The join token was revoked (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/nodes:
    get:
      operationId: listNodes
      summary: List nodes (admin).
      description: |
        Lists enrolled nodes with their connectivity model, lifecycle status, and
        health (Design §12A; FR-NODE-1/2). Removed nodes are excluded by default.
        Platform-RBAC gated (`node:enroll`) + audited.
      tags:
        - nodes
      responses:
        '200':
          description: The enrolled nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: registerNode
      summary: Register an agentless node (admin).
      description: |
        Enrolls an AGENTLESS node (Design §9.2/§9.3; FR-NODE-1): registers its dial
        address and host-identity material — a host-CA-signed host certificate OR
        an explicitly pinned host key (at least one; NEVER TOFU) — with no software
        install. An agent node instead joins via a join token
        (`POST /v1/join-tokens`). Enrollment MAY require approval (operator
        setting): when on, the node starts `pending` and is excluded from targeting
        until activated. Provisioning is a pure API flow (closes the dev-seed
        gap). Platform-RBAC gated (`node:enroll`) + audited.
      tags:
        - nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterNodeRequest'
      responses:
        '201':
          description: The node was registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/nodes/{nodeId}:
    get:
      operationId: getNode
      summary: Get a node (admin).
      description: Returns one node by id. Platform-RBAC gated (`node:enroll`) + audited.
      tags:
        - nodes
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeNode
      summary: Remove a node (admin).
      description: |
        Deregisters the node (soft-remove: status `removed`, excluded from
        targeting; session/audit history preserved) and, for an AGENT node, REVOKES
        its agent credential — the identity is flipped off `active` and a covering
        Lock is pushed, so the generation counter + lock make a stale clone
        unusable and re-join cannot bypass the revocation (FR-NODE-3). Idempotent.
        Platform-RBAC gated (`node:remove`) + audited.
      tags:
        - nodes
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The node was removed (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/nodes/{nodeId}/quarantine:
    post:
      operationId: quarantineNode
      summary: Quarantine a node (admin).
      description: |
        Immediately blocks NEW sessions to the node and tears down or drains
        EXISTING ones (FR-NODE-3), expressed as a top-tier Lock on the node
        (deny wins) actively pushed to every Gateway — fail-closed. The
        `existingSessions` policy selects `kill` (default, torn down at once) vs
        `drain` (finish, no new channels). Platform-RBAC gated (`node:quarantine`)
        + audited.
      tags:
        - nodes
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineNodeRequest'
      responses:
        '200':
          description: The node was quarantined and the lock pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: releaseQuarantine
      summary: Release a node from quarantine (admin).
      description: |
        Lifts a quarantine: releases the node Lock (pushed to every Gateway) and
        returns the node to `active`. Never resurrects a torn-down session.
        Idempotent. Platform-RBAC gated (`node:quarantine`) + audited.
      tags:
        - nodes
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The node was released from quarantine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/jit-requests:
    get:
      operationId: listJitRequests
      summary: List JIT requests (admin).
      description: |
        Lists JIT requests, optionally filtered by `state` or `requester` (Design
        §7; FR-ACC-2). Platform-RBAC gated (`request:approve`) + audited.
      tags:
        - jit-requests
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: requester
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The JIT requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitRequestList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: submitJitRequest
      summary: Submit a JIT access request.
      description: |
        Requests just-in-time access to a target node as a principal for a bounded
        duration (Design §7; FR-ACC-2/3). Open to any authenticated principal — the
        requester is recorded from the authenticated caller, never a body field. The
        matching JIT policy's approval chain is snapshotted; a zero-level chain
        auto-approves (but a Lock still denies on use). Audited.
      tags:
        - jit-requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitRequestSubmission'
      responses:
        '201':
          description: The JIT request was submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitRequestResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/jit-requests/{jitRequestId}:
    get:
      operationId: getJitRequest
      summary: Get a JIT request (admin).
      tags:
        - jit-requests
      parameters:
        - name: jitRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The JIT request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitRequestResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/jit-requests/{jitRequestId}/approve:
    post:
      operationId: approveJitRequest
      summary: Approve a JIT request level (admin).
      description: |
        Approves the next level of a pending JIT request (Design §7; FR-ACC-3/4).
        The approver can NEVER be the requester (self-approval impossible) and may
        act at most once; when all levels are approved the grant clock starts.
        Platform-RBAC gated (`request:approve`) + audited.
      tags:
        - jit-requests
      parameters:
        - name: jitRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitDecisionRequest'
      responses:
        '200':
          description: The updated JIT request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitRequestResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/jit-requests/{jitRequestId}/deny:
    post:
      operationId: denyJitRequest
      summary: Deny a JIT request (admin).
      description: |
        Denies a pending JIT request (terminal). The denier can never be the
        requester. Platform-RBAC gated (`request:approve`) + audited.
      tags:
        - jit-requests
      parameters:
        - name: jitRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitDecisionRequest'
      responses:
        '200':
          description: The denied JIT request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitRequestResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/jit-requests/{jitRequestId}/revoke:
    post:
      operationId: revokeJitRequest
      summary: Revoke an active JIT grant (admin).
      description: |
        Revokes an approved/active JIT grant (Design §7; FR-ACC-2). Also writes a
        strict Lock on the grant's identity+node so a LIVE session tears down
        (§8.4). Platform-RBAC gated (`request:approve`) + audited.
      tags:
        - jit-requests
      parameters:
        - name: jitRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitDecisionRequest'
      responses:
        '200':
          description: The revoked JIT request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitRequestResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/breakglass/credentials:
    get:
      operationId: listBreakglassCredentials
      summary: List break-glass credentials (admin).
      description: |
        Lists registered break-glass FIDO2 credentials (public metadata only)
        (Design §7; FR-ACC-6). Platform-RBAC gated (`breakglass:manage`) + audited.
      tags:
        - breakglass
      responses:
        '200':
          description: The break-glass credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakglassCredentialList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: registerBreakglassCredential
      summary: Register a break-glass FIDO2 key (admin).
      description: |
        Registers a break-glass FIDO2 `sk-ecdsa` PUBLIC key (Design §7; FR-ACC-6).
        Attestation is not required — an admin vouches for the key; only PUBLIC
        material and the SHA-256 fingerprint are stored. Platform-RBAC gated
        (`breakglass:manage`) + audited.
      tags:
        - breakglass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBreakglassCredentialRequest'
      responses:
        '201':
          description: The credential was registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakglassCredentialResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/breakglass/credentials/{credentialId}:
    delete:
      operationId: revokeBreakglassCredential
      summary: Revoke a break-glass credential (admin).
      description: |
        Revokes (soft, `revoked_at`) a registered break-glass credential.
        Idempotent. Platform-RBAC gated (`breakglass:manage`) + audited.
      tags:
        - breakglass
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The credential was revoked (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/breakglass/offline-codes:
    get:
      operationId: listBreakglassOfflineCodes
      summary: List break-glass offline codes (admin).
      description: |
        Lists issued offline-code metadata (NEVER the raw codes) (Design §7;
        FR-ACC-6). Platform-RBAC gated (`breakglass:manage`) + audited.
      tags:
        - breakglass
      responses:
        '200':
          description: The offline-code metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakglassOfflineCodeList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: issueBreakglassOfflineCodes
      summary: Issue a batch of break-glass offline codes (admin).
      description: |
        Issues a batch of single-use break-glass offline codes (Design §7;
        FR-ACC-6). The raw codes are returned exactly ONCE; only their SHA-256
        hashes are stored. Platform-RBAC gated (`breakglass:manage`) + audited.
      tags:
        - breakglass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBreakglassOfflineCodesRequest'
      responses:
        '201':
          description: The codes were issued (raw values returned once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedBreakglassOfflineCodes'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/breakglass/activations:
    get:
      operationId: listBreakglassActivations
      summary: List break-glass activations (admin).
      description: |
        Lists break-glass activations, optionally filtered by `reviewStatus`
        (Design §7; FR-ACC-6/FR-AUD-7). An unreviewed activation is a standing
        signal. Platform-RBAC gated (`breakglass:manage`) + audited.
      tags:
        - breakglass
      parameters:
        - name: reviewStatus
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - reviewed
      responses:
        '200':
          description: The break-glass activations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakglassActivationList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/breakglass/activations/{activationId}/review:
    post:
      operationId: reviewBreakglassActivation
      summary: Record the mandatory review of a break-glass activation (admin).
      description: |
        Records the mandatory post-hoc review of a break-glass activation (Design
        §7; FR-ACC-6/FR-AUD-7). Platform-RBAC gated (`breakglass:manage`) +
        audited.
      tags:
        - breakglass
      parameters:
        - name: activationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBreakglassActivationRequest'
      responses:
        '200':
          description: The reviewed activation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakglassActivationResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  # ===================================================================
  # Config resource CRUD (FR-API-2/5). Contract-first; each
  # resource is platform-RBAC gated + audited, invalid config rejected
  # pre-commit (422). Config resources carry read-only `origin` provenance
  # and an optimistic-concurrency `version`.
  # ===================================================================
  /v1/rules:
    get:
      operationId: listRules
      summary: List data-plane rules (admin).
      description: |
        Lists data-plane RBAC rules (`config.dp_rule`, Design §6.1; FR-AUTHZ-1) —
        the typed allow/deny grants the engine evaluates. A committed deny that
        must persist is a rule; "deny now and keep it" is a runtime `Lock`, not a
        rule (Design §13). Cursor-paginated. Platform-RBAC gated (`rbac:read`).
      tags:
        - rules
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRule
      summary: Create a data-plane rule (admin).
      description: |
        Creates a data-plane rule. Invalid config (empty principals, ttl <= 0, an
        unknown capability, a malformed selector, effect not allow|deny) is
        rejected PRE-COMMIT (`422`, FR-API-5). The `origin` is server-set to `api`.
        Platform-RBAC gated (`rbac:write`) + audited.
      tags:
        - rules
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '201':
          description: The rule was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    get:
      operationId: getRule
      summary: Get a data-plane rule (admin).
      description: Returns one rule by id. Platform-RBAC gated (`rbac:read`).
      tags:
        - rules
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateRule
      summary: Update a data-plane rule (admin).
      description: |
        Replaces the mutable fields of a rule (the `name` is immutable). Invalid
        config is rejected pre-commit (`422`). An optional `version` enforces
        optimistic concurrency (a stale version is a `409`). Platform-RBAC gated
        (`rbac:write`) + audited.
      tags:
        - rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleRequest'
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteRule
      summary: Delete a data-plane rule (admin).
      description: |
        Deletes a rule (idempotent — `204` whether or not it existed).
        Platform-RBAC gated (`rbac:write`) + audited.
      tags:
        - rules
      responses:
        '204':
          description: The rule was deleted (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/roles:
    get:
      operationId: listRoles
      summary: List platform roles (admin).
      description: |
        Lists platform-RBAC roles (`config.platform_role`; FR-PADM-1) — named sets
        of the closed platform-permission vocabulary. Cursor-paginated.
        Platform-RBAC gated (`rbac:read`).
      tags:
        - roles
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createRole
      summary: Create a platform role (admin).
      description: |
        Creates a platform role. A permission outside the closed vocabulary is
        rejected pre-commit (`422`). Platform-RBAC gated (`rbac:write`) + audited.
      tags:
        - roles
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: The role was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
