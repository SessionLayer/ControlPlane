  /v1/cas:
    get:
      operationId: listCas
      summary: List certificate authorities (admin).
      description: |
        Lists CA configurations (`config.ca_config`; FR-CA-1/4/7) — per-CA
        (user|session|host) backend + key REFERENCE and rotation state. NEVER
        exposes private key material (Design §13). Cursor-paginated. Platform-RBAC
        gated (`ca:manage`).
      tags:
        - cas
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of CA configurations (public/config only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaPage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCa
      summary: Create a CA configuration (admin).
      description: |
        Registers a CA configuration. An algorithm/backend mismatch (e.g.
        `ed25519` on `azure_keyvault`, which has no Ed25519 — Design D6) or a
        `keyReference` that looks like private material is rejected pre-commit
        (`422`, FR-API-5). The response NEVER contains private key material.
        Platform-RBAC gated (`ca:manage`) + audited.

        **This is not how you adopt a new backend.** Cold start provisions an
        active CA of each kind and only one active CA per kind is permitted, so on
        any Control Plane that has booted, a create for an existing kind is a `409`
        naming `POST /v1/cas/{caId}/rotate` — which is the path that both installs
        the new key and keeps the old one trusted while the fleet catches up. This
        operation remains for a kind that has no active CA at all.
      tags:
        - cas
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaRequest'
      responses:
        '201':
          description: The CA configuration was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/cas/{caId}:
    parameters:
      - $ref: '#/components/parameters/CaId'
    get:
      operationId: getCa
      summary: Get a CA configuration (admin).
      description: |
        Returns one CA configuration by id (public/config only, NEVER private
        material). Platform-RBAC gated (`ca:manage`).
      tags:
        - cas
      responses:
        '200':
          description: The CA configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateCa
      summary: Update a CA configuration (admin).
      description: |
        Updates a CA configuration's backend/keyReference/algorithm (the `name` and
        `caKind` are immutable; `rotationState` is managed by the rotation state
        machine, not editable here — use rotate). An algorithm/backend mismatch is
        a `422`; a stale `version` is a `409`. Platform-RBAC gated (`ca:manage`) +
        audited.
      tags:
        - cas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaRequest'
      responses:
        '200':
          description: The updated CA configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteCa
      summary: Delete a CA configuration (admin).
      description: |
        Deletes a CA configuration (idempotent). Deleting the sole `active` CA of a
        kind is rejected (`409`) — a kind must always retain a signer. Platform-RBAC
        gated (`ca:manage`) + audited.
      tags:
        - cas
      responses:
        '204':
          description: The CA configuration was deleted (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/cas/{caId}/rotate:
    parameters:
      - $ref: '#/components/parameters/CaId'
    post:
      operationId: rotateCa
      summary: Rotate a CA (admin).
      description: |
        Triggers key rotation for the CA kind of this configuration (FR-CA-7): a new
        key is provisioned and becomes `incoming`, the current `active` row moves to
        `outgoing` (both trusted during the overlap window), and the new key is
        promoted to `active`. The outgoing key still verifies existing certs until it
        expires. NEVER returns private material. Platform-RBAC gated (`ca:rotate`) +
        audited.

        The incoming key is provisioned in the active CA's backend unless the body
        overrides `backend`, which is how a CA is **adopted onto a key service**: the
        operator creates the key in the vault or in KMS beforehand and names it here
        by its pinned identifier, and the Control Plane reads only its public half.
        Nothing about the private key crosses this API in either direction.
      tags:
        - cas
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateCaRequest'
      responses:
        '200':
          description: Rotation completed; the new active CA configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaResource'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/cas/mtls/trust-anchor:
    get:
      operationId: getMtlsTrustAnchor
      summary: Export the internal mTLS CA trust anchor (admin).
      description: |
        Returns the PEM-encoded X.509 **certificate** of the active internal mTLS
        CA — the trust anchor a Gateway pins to verify the Control Plane on the
        CP↔Gateway plane (Design §2A, §15; FR-CA-3). This is public material: it
        reads `runtime.ca_key_material.ca_certificate` and nothing else, and the
        wrapped private key is never touched, unwrapped, or returned.

        The internal mTLS CA is deliberately absent from the `/v1/cas` collection
        (which serves the three SSH CA kinds), so it has no `caId` to address and
        no update/delete/rotate surface. This is a read-only sibling path, not a
        member of that collection.

        Platform-RBAC gated (`gateway:enroll`) so an operator can bring up a
        Gateway without holding `ca:manage`.
      tags:
        - cas
      responses:
        '200':
          description: The active internal mTLS CA certificate (public trust anchor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MtlsTrustAnchor'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/cas/{caKind}/public-key:
    parameters:
      - $ref: '#/components/parameters/CaKindPath'
    get:
      operationId: getCaPublicKey
      summary: Export an SSH CA's public key (admin).
      description: |
        Returns the PUBLIC key of the active CA of one SSH kind, in the two forms
        an operator actually needs: the DER SubjectPublicKeyInfo (base64) and the
        OpenSSH one-line authorized-key form. Installing a node requires the
        session CA's public key in `TrustedUserCAKeys` — without an export path
        the only source is a `SELECT` against `runtime.ca_key_material` as the
        database owner, on the path every node install must walk.

        Public verification material only. The projection is column-scoped: it
        reads the stored public key and never touches the wrapped private key or
        routes through the backend unwrap path.

        `caKind` is one of the three SSH kinds (`user`, `session`, `host`). The
        internal mTLS CA is not addressable here — it is not a member of this
        collection and its trust anchor has its own sibling path — so `mtls` is
        not an accepted value (`400`). Platform-RBAC gated (`node:enroll`), the
        permission installing a node already requires.

        If the active CA of that kind carries an algorithm that has no OpenSSH
        key type — a row predating the create-time check, or one written directly
        to the database — the export REFUSES with `409` rather than emitting a
        line it cannot honestly label. Guessing would put a wrong
        `ecdsa-sha2-nistp256` line into `TrustedUserCAKeys` on every node, and
        that failure surfaces at session time, everywhere at once, with nothing
        pointing back to the export. `404` would be untrue, since the CA exists,
        and `400` would blame a caller who did nothing wrong.
      tags:
        - cas
      responses:
        '200':
          description: The active CA's public key (public material only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaPublicKey'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/gateway-enrollment-tokens:
    get:
      operationId: listGatewayEnrollmentTokens
      summary: List active Gateway enrollment tokens (admin).
      description: |
        Lists the current unconsumed, unexpired Gateway enrollment tokens. The raw
        token value is NEVER returned (only its metadata) — it is shown exactly
        once at issuance. Platform-RBAC gated (`gateway:enroll`) + audited
        (Design §4.B; FR-JOIN-3).
      tags:
        - gateway-enrollment-tokens
      responses:
        '200':
          description: The active enrollment tokens (metadata only, never the raw token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayEnrollmentTokenList'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: issueGatewayEnrollmentToken
      summary: Issue a Gateway enrollment token (admin).
      description: |
        Issues a short-lived, single-use enrollment token bound to one stable
        Gateway name (Design §4.B; FR-JOIN-3). The raw token is returned exactly
        ONCE, for out-of-band delivery to the Gateway being installed; only its
        SHA-256 hash is stored. It authorises nothing beyond the enrollment
        handshake the Gateway already performs, for that name, once, before it
        expires.

        This is the API equivalent of the raw `INSERT INTO
        runtime.gateway_enrollment_token` the install guide used to require, so
        installing a Gateway no longer needs a database credential. Platform-RBAC
        gated (`gateway:enroll`) + audited.
      tags:
        - gateway-enrollment-tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueGatewayEnrollmentTokenRequest'
      responses:
        '201':
          description: An enrollment token was issued (raw value returned once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedGatewayEnrollmentToken'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/gateway-enrollment-tokens/{gatewayEnrollmentTokenId}:
    delete:
      operationId: revokeGatewayEnrollmentToken
      summary: Revoke a Gateway enrollment token (admin).
      description: |
        Revokes an unconsumed enrollment token so it can never be used.
        Idempotent. Revocation marks the token consumed rather than deleting the
        row: `cp_runtime` holds no DELETE on `runtime.gateway_enrollment_token`
        (V15 least-privilege), and the enrollment path already refuses a consumed
        token. Revoking an already-used token has no effect on the identity it
        produced — revoking an issued Gateway identity is a Lock. Platform-RBAC
        gated (`gateway:enroll`) + audited.
      tags:
        - gateway-enrollment-tokens
      parameters:
        - name: gatewayEnrollmentTokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The enrollment token was revoked (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/gateways:
    get:
      operationId: listGateways
      summary: List enrolled Gateway identities (admin).
      description: |
        Lists enrolled Gateways (`runtime.gateway_identity`; FR-BOOT-3) with the
        identity metadata an operator needs to recognise one: name, certificate
        fingerprint, generation counter, join method, status, the current
        identity's validity window, and how many node control channels it
        currently owns. Cursor-paginated.

        Metadata ONLY. No certificate, no key reference, no key material — a
        Gateway's mTLS identity reference is not part of this projection and
        cannot be derived from it.

        Platform-RBAC gated (`gateway:enroll`), not the generic `rbac:read`:
        `listNodes` is gated `node:enroll` on the same reasoning, and a fleet
        roster of Gateway names, certificate fingerprints and which Gateway
        fronts which nodes is targeting metadata rather than ordinary config.
      tags:
        - gateways
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: name
          in: query
          required: false
          description: Filter to one Gateway name.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by identity status.
          schema:
            type: string
            enum:
              - active
              - locked
              - revoked
      responses:
        '200':
          description: A page of Gateway identities (metadata only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayPage'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/gateways/{gatewayId}:
    parameters:
      - $ref: '#/components/parameters/GatewayId'
    get:
      operationId: getGateway
      summary: Get a Gateway identity (admin).
      description: >-
        Returns one Gateway identity by id, the same metadata-only projection the
        collection serves. Platform-RBAC gated (`gateway:enroll`).
      tags:
        - gateways
      responses:
        '200':
          description: The Gateway identity (metadata only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeGateway
      summary: Remove a Gateway identity (admin, privileged).
      description: |
        Removes an enrolled Gateway identity and FREES ITS NAME for
        re-enrollment. The common trigger is a fingerprint-pin mismatch after a
        restore, where the recorded identity no longer matches the Gateway that
        holds the key, so the name has to be released before the replacement can
        enroll. Idempotent. Platform-RBAC gated (`gateway:remove`) + audited.

        The permission is deliberately NOT `gateway:enroll`. Enrollment and
        removal are separate verbs here for the same reason `node:enroll` and
        `node:remove` are separate: removal is destructive in a way enrollment is
        not, and a credential trusted to bring a Gateway up should not thereby be
        trusted to take one down.

        **A Gateway that currently owns node control channels is refused
        (`409`)** unless `force=true`. Removing a live owner strands every node
        it fronts until another Gateway claims presence. The forced removal is
        recorded as a distinct audit action from the ordinary one, so the two are
        never conflated after the fact.
      tags:
        - gateways
      parameters:
        - name: force
          in: query
          required: false
          description: >-
            Remove the identity even while it owns node control channels. Use
            only when the Gateway is known not to be coming back.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: The Gateway identity was removed (idempotent).
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/service-accounts:
