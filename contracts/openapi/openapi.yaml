        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/session-limit-policies/{sessionLimitPolicyId}:
    parameters:
      - $ref: '#/components/parameters/SessionLimitPolicyId'
    get:
      operationId: getSessionLimitPolicy
      summary: Get a session-limit policy (admin).
      description: Returns one session-limit policy by id. Platform-RBAC gated (`rbac:read`).
      tags:
        - session-limit-policies
      responses:
        '200':
          description: The session-limit policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLimitPolicyResource'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateSessionLimitPolicy
      summary: Update a session-limit policy (admin).
      description: |
        Replaces the mutable fields of a session-limit policy (the `name` is
        immutable). Invalid config is rejected pre-commit (`422`). The `version`
        is required and must match (optimistic concurrency — a stale version is
        a `409`). Platform-RBAC gated (`settings:write`) + audited.
      tags:
