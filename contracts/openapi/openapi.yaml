    # ============ operator-settings (operator_settings, singleton) ============
    OperatorSettings:
      type: object
      title: Operator Settings
      description: |
        The cluster-wide operator settings singleton. This is a deliberately
        narrower projection than the underlying row: the key-encryption-key
        reference, the first-admin bootstrap fields, and the recording key's
        bytes are not part of it and cannot be derived from it.

        `defaultCaBackend`, `origin`, `version` and the timestamps are read-only
        — `defaultCaBackend` is consumed only when cold start provisions a CA
        kind that has no row yet, so it governs nothing once the CAs exist; a
        live CA's backend is managed under `/v1/cas`.
      required:
        - auditRetentionDays
        - recordingRetentionDays
        - defaultWormMode
        - otpTtlSeconds
        - defaultCaBackend
        - deploymentManagedFields
        - recordingKeyConfigured
        - recordingKeySealAlgorithm
        - origin
        - version
      properties:
        auditRetentionDays:
          type: integer
          format: int32
          minimum: 1
          description: >-
            How long audit-event partitions are kept (FR-AUD-6). Increases only
            over this API.
        recordingRetentionDays:
          type: integer
          format: int32
          minimum: 1
          description: >-
            The retention window stamped on new recordings as the object-lock
            retain-until (FR-AUD-6). Increases only over this API.
        defaultWormMode:
          $ref: '#/components/schemas/WormMode'
        otpTtlSeconds:
          type: integer
          format: int32
          minimum: 60
          maximum: 300
          description: Default OTP lifetime (FR-AUTH-9).
        defaultCaBackend:
          $ref: '#/components/schemas/CaBackend'
        defaultMaxSessionSeconds:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Cluster default max session duration (FR-SESS-3); absent means no
            cluster-wide ceiling. Per-identity overrides live in
            `/v1/session-limit-policies`.
        defaultIdleTimeoutSeconds:
          type: integer
          format: int32
          minimum: 1
          description: Cluster default idle timeout (FR-SESS-3); absent means none.
        defaultMaxConcurrentSessions:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Cluster default concurrent-session cap (FR-SESS-3); absent means
            uncapped by default.
        deploymentManagedFields:
          type: array
          description: >-
            Which fields a deployment property currently pins. Computed per
            request, so it reflects this Control Plane's configuration rather
            than anything stored. A write to a listed field is a `422`.
          items:
            $ref: '#/components/schemas/DeploymentManagedField'
        recordingKeyConfigured:
          type: boolean
          description: >-
            Whether a customer recording key is provisioned. False means strict
            recording will refuse every session until one is set; the key itself
            is served by `/v1/operator-settings/recording-customer-key`.
        recordingKeySealAlgorithm:
          $ref: '#/components/schemas/RecordingKeySealAlgorithm'
        recordingKeyRef:
          type: string
          description: The operator's reference to the customer key — NEVER key material.
        origin:
          $ref: '#/components/schemas/Origin'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    UpdateOperatorSettingsRequest:
      type: object
      title: Update Operator Settings Request
      description: |
        Replaces the writable settings. The four always-present knobs are
        required, so a partial body can never quietly reset one to its
        cold-start default. The three session-limit defaults are nullable in the
        model, and omitting one CLEARS the cluster default for that knob — read,
        modify, and send the whole resource back.

        Both retention fields and `defaultWormMode` ratchet: they accept an
        unchanged value or a move towards keeping more evidence
        (`governance` -> `compliance`), and refuse the other direction with a
        `422`.

        `defaultCaBackend`, the key-encryption-key reference, the bootstrap
        fields and the recording key are absent by design; sending any of them
        is a `400`, not a silent no-op.
      required:
        - auditRetentionDays
        - recordingRetentionDays
        - defaultWormMode
        - otpTtlSeconds
        - version
      properties:
        auditRetentionDays:
          type: integer
          format: int32
          minimum: 1
          description: Must be greater than or equal to the stored value; a decrease is a `422`.
        recordingRetentionDays:
          type: integer
          format: int32
          minimum: 1
          description: Must be greater than or equal to the stored value; a decrease is a `422`.
        defaultWormMode:
          $ref: '#/components/schemas/WormMode'
        otpTtlSeconds:
          type: integer
          format: int32
          minimum: 60
          maximum: 300
        defaultMaxSessionSeconds:
          type: integer
          format: int32
          minimum: 1
          description: Omit to clear. A change to a deployment-pinned field is a `422`.
        defaultIdleTimeoutSeconds:
          type: integer
          format: int32
          minimum: 1
          description: Omit to clear. A change to a deployment-pinned field is a `422`.
        defaultMaxConcurrentSessions:
          type: integer
          format: int32
          minimum: 1
          description: Omit to clear. A change to a deployment-pinned field is a `422`.
        version:
          type: integer
          format: int64
          description: The current resource version; required and must match (optimistic concurrency — no silent lost update).
      additionalProperties: false
    RecordingCustomerKey:
      type: object
      title: Customer Recording Key
      description: >-
        The customer-held recording key, PUBLIC half only (FR-AUD-2, Design
        §15). The private half never reaches the platform, so the platform
        cannot decrypt recordings sealed to it.
      required:
        - configured
        - sealAlgorithm
      properties:
        configured:
          type: boolean
          description: >-
            False on a fresh install, where no key has been provisioned yet and
            strict recording therefore refuses every session. The key fields
            below are absent in that state.
        publicKey:
          type: string
          description: >-
            The customer's public key as base64-encoded DER SubjectPublicKeyInfo
            — the exact text that was submitted, so an operator can compare it
            against their own record of what they provisioned.
        sealAlgorithm:
          $ref: '#/components/schemas/RecordingKeySealAlgorithm'
        keyRef:
          type: string
          description: >-
            The operator's reference to the key (persisted onto each recording
            so replay can find the customer's unwrap path) — NEVER key material.
        fingerprintSha256:
          type: string
          description: >-
            Lowercase hex SHA-256 over the DER SubjectPublicKeyInfo. This is the
            value a rotation must echo, and the only form of the key that audit
            records carry.
        updatedAt:
          type: string
          format: date-time
          description: When the key was last provisioned or rotated.
      additionalProperties: false
    SetRecordingCustomerKeyRequest:
      type: object
      title: Set Recording Customer Key Request
      description: |
        Provisions or rotates the customer recording key. Only the PUBLIC half is
        ever accepted: a submission that is private key material in any encoding
        is rejected outright (`422`), as is one whose curve or algorithm does not
        match `sealAlgorithm`.

        A write when a key is already configured is a ROTATION, and every
        recording sealed under the outgoing key stays readable only by the
        outgoing private key. A rotation therefore additionally requires
        `expectedFingerprintSha256` and
        `acknowledgeExistingRecordingsUndecryptable`. First provisioning
        requires neither, and refuses both with a `422`: a caller that believes
        it is replacing a key when none exists has lost track of the cluster's
        state, and silently provisioning for it would hide that.
      required:
        - publicKey
        - sealAlgorithm
        - version
      properties:
        publicKey:
          type: string
          minLength: 1
          maxLength: 12288
          description: >-
            The customer's PUBLIC key as base64-encoded DER SubjectPublicKeyInfo,
            at most 8 KiB decoded. Private key material — PKCS#8, SEC1, or PEM
            text of any kind — is rejected (`422`); only the public half is ever
            stored.
        sealAlgorithm:
          $ref: '#/components/schemas/RecordingKeySealAlgorithm'
        keyRef:
          type: string
          maxLength: 255
          description: >-
            An optional operator reference to where the private half is held.
            A reference only — a value carrying key material is a `422`.
        expectedFingerprintSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            ROTATION ONLY, and required there: the lowercase hex SHA-256 of the
            key being replaced. A mismatch is a `409`, so a blind or racing
            overwrite of a key someone else just set cannot succeed.
        acknowledgeExistingRecordingsUndecryptable:
          type: boolean
          description: >-
            ROTATION ONLY, and required there: must be `true`, acknowledging
            that recordings sealed under the outgoing key will not be readable
            with the incoming one. Absent or `false` is a `422`.
        version:
          type: integer
          format: int64
          description: The current operator-settings version; required and must match (optimistic concurrency — a stale version is a `409`).
      additionalProperties: false
    # ============ sessions (ssh_session, runtime) ============
    SessionResource:
      type: object
      title: SSH Session
      required:
