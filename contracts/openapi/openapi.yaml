        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSessionLimitPolicy
      summary: Create a session-limit policy (admin).
      description: |
        Creates a session-limit policy. Invalid config (a malformed
        `identitySelector`, a non-positive limit, or all three limits absent) is
        rejected PRE-COMMIT (`422`, FR-API-5). The `origin` is server-set to
