{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sessionlayer-controlplane.fullname" . }}
  labels:
    {{- include "sessionlayer-controlplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sessionlayer-controlplane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The mTLS gRPC plane: Gateways enrolling, renewing, authorizing, signing
    # certificates and streaming locks, and Agents joining and renewing.
    - from:
        {{- with .Values.networkPolicy.gatewayPodSelector }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.agentPodSelector }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- range .Values.networkPolicy.extraGrpcIngressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.mtls.port }}
    # REST and the OIDC pages, reached by browsers, admins and automation. This
    # is deliberately open: it belongs behind a TLS-terminating load balancer
    # that can live anywhere, and OIDC plus mTLS are the real gate.
    - ports:
        - protocol: TCP
          port: 8080
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- with .Values.networkPolicy.dnsPodSelector }}
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with .Values.networkPolicy.postgresPodSelector }}
    # Postgres, the single source of truth. For a managed database replace this
    # selector with an ipBlock under extraEgress.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- with .Values.networkPolicy.wormCidrs }}
    # Presigned URL issuance and the bucket warm-up on boot. Recording bytes
    # never pass through this process.
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.oidcCidrs }}
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- with .Values.networkPolicy.otelPodSelector }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4317
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
