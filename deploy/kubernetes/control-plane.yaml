# SessionLayer Control Plane — Kubernetes deployment.
#
# Migration ordering (Flyway-vs-traffic): this deliberately does NOT use an
# initContainer or a separate migration Job. Flyway already runs synchronously
# during Spring context refresh — before the web server's Lifecycle starts and
# well before ApplicationRunner beans run — and Boot does not flip the
# readiness state to ACCEPTING_TRAFFIC until every ApplicationRunner
# (caColdStartRunner, firstAdminBootstrapRunner — both in this app, both
# bounded blocks) has returned, which is itself after Flyway. So "migrate on
# boot, gate traffic on /actuator/health/readiness" falls out of Spring Boot's
# own startup sequencing with no extra plumbing; the readinessProbe below is
# what actually enforces it.
#
# Rolling update with 2 replicas therefore CAN run Flyway from two pods at
# once during the transition. This is safe, not just tolerated: Flyway's
# Postgres support takes a DB-level lock before applying migrations, so the
# second pod blocks until the first finishes, then finds nothing pending and
# no-ops (MigrationIntegrityIT's `secondMigrateIsANoOp` covers this same
# property for a single instance). The generous startupProbe below exists so
# that lock wait — plus the two bounded ApplicationRunners — never trips a
# restart mid-lock-wait. What this does NOT solve: forward-compatibility of
# the schema across the two image versions coexisting during the rollout is
# an application-level (expand/contract migration) concern, not a deploy-
# manifest one.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sessionlayer-controlplane
  labels: { app.kubernetes.io/name: sessionlayer-controlplane }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sessionlayer-controlplane-config
  labels: { app.kubernetes.io/name: sessionlayer-controlplane }
data:
  # Two Postgres roles, on purpose (see docs/installation/control-plane.md):
  # Flyway migrates as the owner; the request path runs as the restricted
  # cp_runtime role. Point both at your real Postgres; this default matches
  # an in-cluster Postgres reachable as `postgres.sessionlayer.svc`.
  SPRING_R2DBC_URL: "r2dbc:postgresql://postgres.sessionlayer.svc:5432/sessionlayer"
  SPRING_R2DBC_USERNAME: "cp_runtime"
  SPRING_FLYWAY_URL: "jdbc:postgresql://postgres.sessionlayer.svc:5432/sessionlayer"
  SPRING_FLYWAY_USER: "sessionlayer"

  # The mTLS gRPC plane Gateways and Agents dial. Port 9443 (not the built-in
  # 9090 default) to match every other manifest in this project — see
  # Documentation/docs/reference/ports.md. Hostnames land in the SANs of the
  # server certificate this process mints at runtime from the internal mTLS
  # CA; they must match what Gateway/Agent actually dial.
  #
  # These names assume the `sessionlayer` namespace. A manifest cannot template
  # its own namespace, so applied anywhere else this mints a certificate whose
  # SANs nothing dials — and the failure surfaces as a TLS error at connect
  # time, far from the line that caused it. Edit them to match, or use the Helm
  # chart, which derives them from the release namespace.
  SESSIONLAYER_MTLS_SERVER_PORT: "9443"
  SESSIONLAYER_MTLS_SERVER_HOSTNAMES: "controlplane.sessionlayer.svc,controlplane.sessionlayer.svc.cluster.local,controlplane,localhost"

  # WORM recording store (S3-compatible). The Control Plane only ever issues
  # presigned URLs to this endpoint; recording bytes never pass through it.
  SESSIONLAYER_RECORDING_WORM_ENDPOINT: "https://worm.example.com"
  SESSIONLAYER_RECORDING_WORM_REGION: "us-east-1"
  SESSIONLAYER_RECORDING_WORM_BUCKET: "sessionlayer-recordings"
  SESSIONLAYER_RECORDING_WORM_PATH_STYLE_ACCESS: "false"

  # OIDC RP (disable by setting to "false" and dropping the rest, e.g. for an
  # OTP/pins/machine-id-only deployment).
  SESSIONLAYER_OIDC_ENABLED: "true"
  SESSIONLAYER_OIDC_ISSUER: "https://idp.example.com"
  SESSIONLAYER_OIDC_CLIENT_ID: "sessionlayer-controlplane"
  SESSIONLAYER_OIDC_REDIRECT_URI: "https://cp.example.com/v1/auth/callback"

  # Container-aware heap sizing: without this the JVM's default
  # MaxRAMPercentage (25%) undersizes the heap against the resources.limits
  # below for a WebFlux + gRPC + R2DBC workload.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

  # Uncomment to enforce a cluster-default session-limit (FR-SESS-3); unset
  # leaves the stored operator_settings.default_* column untouched and the CP
  # WARNs at boot that identities are unlimited. See
  # ../session-limits-example.properties.
  # SESSIONLAYER_SESSION_LIMITS_DEFAULT_MAX_CONCURRENT: "3"

  # Uncomment to name the first platform admin by OIDC subject instead of
  # claiming the printed-once bootstrap credential from the logs.
  # SESSIONLAYER_BOOTSTRAP_ADMIN_SUBJECT: "alice@example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sessionlayer-controlplane
  labels: { app.kubernetes.io/name: sessionlayer-controlplane }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: sessionlayer-controlplane }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sessionlayer-controlplane }
    spec:
      serviceAccountName: sessionlayer-controlplane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controlplane
          image: ghcr.io/sessionlayer/controlplane:v0.0.2 # pin by digest in production
          envFrom:
            - configMapRef: { name: sessionlayer-controlplane-config }
            - secretRef: { name: sessionlayer-controlplane-secrets }
          ports:
            - { name: rest, containerPort: 8080 }
            - { name: mtls-grpc, containerPort: 9443 }
          securityContext:
            allowPrivilegeEscalation: false # sets no_new_privs
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          # /actuator/health/readiness is public (SecurityConfiguration's
          # PUBLIC_PATHS) and reflects Boot's own ReadinessState, which does not
          # flip to ACCEPTING_TRAFFIC until Flyway + both ApplicationRunners are
          # done (see the top-of-file note).
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          # /actuator/health/liveness reflects LivenessState only (never a
          # downstream dependency like Postgres/WORM/OIDC) — a slow Postgres
          # must surface as a failed readiness/request, not a restart storm.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 15
            failureThreshold: 3
          # Slack for Flyway (safe even if a peer pod holds the migration lock,
          # see above) + the two bounded ApplicationRunners (60s + 30s) + JVM
          # start. 60 * 5s = 5 minutes before a slow-starting pod is killed.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
      volumes:
        # Netty's native epoll transport unpacks a .so here at startup; if it
        # can't (e.g. a noexec tmpfs) it falls back to NIO with a log warning,
        # never a crash — verified against this exact image.
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  # Named to match the Gateway's own example `cp_mtls_endpoint`
  # (controlplane.sessionlayer.svc:9443, see `deploy/kubernetes/gateway.yaml` in
  # the `SessionLayer/Gateway` repo) out of the box; the pod label above, not
  # this name, is what the Gateway's NetworkPolicy actually selects on.
  name: controlplane
  labels: { app.kubernetes.io/name: sessionlayer-controlplane }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: sessionlayer-controlplane }
  ports:
    - { name: rest, port: 8080, targetPort: 8080 }
    - { name: mtls-grpc, port: 9443, targetPort: 9443 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sessionlayer-controlplane
  labels: { app.kubernetes.io/name: sessionlayer-controlplane }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sessionlayer-controlplane }
