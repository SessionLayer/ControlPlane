apiVersion: v1
kind: Secret
metadata:
  name: sessionlayer-controlplane-secrets
  labels: { app.kubernetes.io/name: sessionlayer-controlplane }
type: Opaque
stringData:
  SPRING_FLYWAY_PASSWORD: "REPLACE-ME-owner-password"

  # Substituted into the cp_runtime role's ALTER ROLE on the FIRST migration
  # only. Must equal SPRING_R2DBC_PASSWORD below, alphanumeric only (it
  # lands in an ALTER ROLE ... PASSWORD literal). Rotating later means
  # ALTER ROLE cp_runtime PASSWORD ... in Postgres directly, in lockstep with
  # SPRING_R2DBC_PASSWORD - changing this value afterwards rotates nothing.
  SPRING_FLYWAY_PLACEHOLDERS_CPRUNTIMEPASSWORD: "REPLACE-ME-runtime-password"

  SPRING_R2DBC_PASSWORD: "REPLACE-ME-runtime-password"

  # 32-byte base64 key-encryption-key for the local CA backend's envelope-
  # encrypted CA private keys (openssl rand -base64 32). No dev-KEK fallback
  # is configured here on purpose: an operator who forgets this fails closed
  # at boot rather than silently wrapping CA keys under a public constant.
  SESSIONLAYER_CA_LOCAL_KEK_BASE64: "REPLACE-ME-32-byte-base64-kek"

  SESSIONLAYER_OIDC_CLIENT_SECRET: "REPLACE-ME-oidc-client-secret"
  SESSIONLAYER_OIDC_STATE_HMAC_KEY: "REPLACE-ME-oidc-state-hmac-key"

  SESSIONLAYER_RECORDING_WORM_ACCESS_KEY: "REPLACE-ME-worm-access-key"
  SESSIONLAYER_RECORDING_WORM_SECRET_KEY: "REPLACE-ME-worm-secret-key"
